// Installment Payment History — Phase 1: single shared read-only helper.
// FOUNDATION ONLY — nothing in this phase calls this from makeInv(),
// makeReceipt(), or bAnalytics() yet; those keep computing received/balance
// themselves exactly as before, untouched. This exists so a later phase has
// one correct place to switch over to, instead of the three duplicated
// calculations already in the codebase.
//
// totalDue comes from the same calcOpt()/selected-option engine already used
// everywhere else (quotations, vouchers, invoices, sticky cost bar).
//
// totalReceived sums valid, positive paymentHistory[].amount entries when
// any exist; otherwise it falls back to the existing single b.paymentReceived
// field, so every booking created before this phase (empty/missing
// paymentHistory) produces exactly the same totalReceived it always has.
// Invalid entries (missing/non-numeric/zero/negative amount, or a
// non-object array entry) are silently skipped, never thrown.
function getPaymentSummary(b){
  var on=(b&&b.selectedOption)||1;
  var c=calcOpt(b,on);
  var totalDue=c.grandTotal||0;

  var history=(b&&Array.isArray(b.paymentHistory))?b.paymentHistory:[];
  var validAmounts=history.filter(function(p){
    return p&&typeof p==='object'&&isFinite(parseFloat(p.amount))&&parseFloat(p.amount)>0;
  }).map(function(p){return parseFloat(p.amount);});

  var totalReceived;
  if(validAmounts.length>0){
    totalReceived=validAmounts.reduce(function(sum,amt){return sum+amt;},0);
  } else {
    // No valid installments recorded yet — fall back to the existing
    // cumulative field for full backward compatibility.
    totalReceived=parseFloat(b&&b.paymentReceived)||0;
  }

  // Round to the nearest paisa before comparing, so float artifacts (e.g.
  // 0.1+0.2 from summed installments) never misclassify an exact match as
  // "Partially Paid" or "Overpaid".
  var balance=Math.round((totalDue-totalReceived)*100)/100;

  var status;
  if(totalReceived<=0) status='Unpaid';
  else if(balance>0) status='Partially Paid';
  else if(balance===0) status='Fully Paid';
  else status='Overpaid';

  return {totalReceived:totalReceived,balance:balance,status:status};
}

// ══════════════════════════════════════════════════════════════
//  SUPPLIER PAYMENT LEDGER — summary reader (additive, read-only).
//  Deliberately does NOT call calcOpt() and does NOT read mkPct/mkFixed/
//  misc/gstPct/grandTotal anywhere — supplier figures are 100% manual,
//  NET-of-markup entries, entirely independent of the Guest costing
//  engine and of getPaymentSummary()/paymentHistory above. Invalid
//  entries (missing/non-numeric/negative amounts) are silently skipped,
//  never thrown, mirroring getPaymentSummary()'s defensive style.
// ══════════════════════════════════════════════════════════════
function getSupplierPaymentSummary(b){
  var suppliers=(b&&Array.isArray(b.supplierPayments))?b.supplierPayments:[];
  var totalNetPayable=0,totalPaid=0;
  var rows=suppliers.map(function(s){
    var netPayable=isFinite(parseFloat(s&&s.netPayable))?parseFloat(s.netPayable):0;
    if(netPayable<0) netPayable=0;
    var payments=(s&&Array.isArray(s.payments))?s.payments:[];
    var paid=payments.filter(function(p){
      return p&&typeof p==='object'&&isFinite(parseFloat(p.amount))&&parseFloat(p.amount)>0;
    }).reduce(function(sum,p){return sum+parseFloat(p.amount);},0);
    var balance=Math.round((netPayable-paid)*100)/100;
    totalNetPayable+=netPayable;
    totalPaid+=paid;
    return {id:s&&s.id,supplierName:(s&&s.supplierName)||'',supplierType:(s&&s.supplierType)||'Other',netPayable:netPayable,paid:paid,balance:balance};
  });
  totalNetPayable=Math.round(totalNetPayable*100)/100;
  totalPaid=Math.round(totalPaid*100)/100;
  var totalBalance=Math.round((totalNetPayable-totalPaid)*100)/100;
  return {rows:rows,totalNetPayable:totalNetPayable,totalPaid:totalPaid,totalBalance:totalBalance};
}

          payList.appendChild(div('font-size:11.5px;color:#8A8272;font-style:italic;padding:2px 2px 8px','No payments recorded yet.'));
        }
        card.appendChild(payList);

        var addPayBtn=btn('+ Add Payment','btn sm ob',function(){
          addSupplierPaymentEntry(b,sIdx);renderSupList();renderSupSummary();
        });
        card.appendChild(addPayBtn);

        supList.appendChild(card);
      });
    }

    renderSupSummary();
    renderSupList();

    frag.appendChild(btn('+ Add Supplier','btn sm gn',function(){
      addSupplierEntry(b);renderSupList();renderSupSummary();
    }));
  }
  return frag;
}

  function handleRateAddSave(){

      roomCategory:(rateAddSt.roomCategory||'').trim(),

    if(!fields.hotelName||!fields.roomCategory||!fields.mealPlan){

      var result=addHotelRateManual(fields,mode);

      renderRateList();
      toast(result.action==='updated'?'✅ Existing rate updated!':'✅ Rate added!');

        'A rate already exists for "'+fields.hotelName+'" — '+(fields.city||'—')+' • '+fields.roomCategory+' • '+fields.mealPlan+'. What would you like to do?',

  function handleRateEditSave(origRecord){
    var fields={
      hotelName:(rateEditSt.hotelName||'').trim(),
      city:(rateEditSt.city||'').trim(),
      category:(rateEditSt.category||'').trim(),
      roomCategory:(rateEditSt.roomCategory||'').trim(),
      mealPlan:(rateEditSt.mealPlan||'').trim(),
      roomRate:parseFloat(rateEditSt.roomRate)||0,
      extraAdult:parseFloat(rateEditSt.extraAdult)||0,
      extraChildWB:parseFloat(rateEditSt.extraChildWB)||0,
      extraChildNB:parseFloat(rateEditSt.extraChildNB)||0,
      extraMattress:parseFloat(rateEditSt.extraMattress)||0,
      remarks:(rateEditSt.remarks||'').trim()
    };
    if(!fields.hotelName||!fields.roomCategory||!fields.mealPlan){
      toast('Hotel Name, Room Category and Meal Plan are required',false);
      return;
    }
    // Refinement #2: warn when any of the 4 lookup-key fields change —
    // future auto-fill will use the new key; already-filled bookings
    // are untouched (same as import's behavior, nothing retroactive).
    var keyChanged=
      fields.hotelName.toLowerCase()!==(origRecord.hotelName||'').toLowerCase() ||
      fields.city.toLowerCase()!==(origRecord.city||'').toLowerCase() ||
      fields.roomCategory.toLowerCase()!==(origRecord.roomCategory||'').toLowerCase() ||
      fields.mealPlan.toLowerCase()!==(origRecord.mealPlan||'').toLowerCase();
    function doSave(){
      updateHotelRateManual(origRecord.id,fields);
      cancelRateEdit();
      renderRateList();
      toast('✅ Rate updated!');
    }
    if(keyChanged){
      confirmDialog(
        'You are changing the Hotel Name, City, Room Category or Meal Plan of this rate. Future Booking Calculator auto-fill will use these new details. Bookings that already auto-filled from this rate will remain unchanged. Continue?',
        doSave,'Continue','Cancel'
      );
    } else {
      doSave();
    }
  }

  function renderRateList(){
    rateListWrap.innerHTML='';
    var rates=loadHotelRates();
    var filtered=rates.filter(function(r){
      if(!rateSearchSt.q) return true;
      var hay=[r.hotelName,r.city,r.category,r.roomCategory,r.mealPlan,r.remarks].join(' ').toLowerCase();
      return hay.indexOf(rateSearchSt.q)>=0;
    });
    if(!filtered.length){
      var empty=el('div');empty.className='card';empty.style.cssText='text-align:center;color:#8A8090;padding:20px';
      empty.textContent=rates.length?'No rates match your search.':'No hotel rates imported yet.';
      rateListWrap.appendChild(empty);
      return;
    }
    filtered.forEach(function(r){
      var card=el('div');card.className='card';card.style.cssText='margin-bottom:8px';

      if(rateEditingId===r.id){
        var title=el('div');title.style.cssText='font-size:13px;font-weight:700;color:#D4A843;margin-bottom:10px';title.textContent='Edit Rate';
        card.appendChild(title);
        card.appendChild(fld('Hotel Name',inp(rateEditSt.hotelName,function(v){rateEditSt.hotelName=v;},'text')));
        card.appendChild(fld('City',inp(rateEditSt.city,function(v){rateEditSt.city=v;},'text')));
        card.appendChild(fld('Category',inp(rateEditSt.category,function(v){rateEditSt.category=v;},'text')));
        card.appendChild(fld('Room Category',inp(rateEditSt.roomCategory,function(v){rateEditSt.roomCategory=v;},'text')));
        card.appendChild(fld('Meal Plan',inp(rateEditSt.mealPlan,function(v){rateEditSt.mealPlan=v;},'text')));
        card.appendChild(fld('Room Rate',inp(rateEditSt.roomRate,function(v){rateEditSt.roomRate=v;},'number')));
        card.appendChild(fld('Extra Adult',inp(rateEditSt.extraAdult,function(v){rateEditSt.extraAdult=v;},'number')));
        card.appendChild(fld('Extra Child (With Bed)',inp(rateEditSt.extraChildWB,function(v){rateEditSt.extraChildWB=v;},'number')));
        card.appendChild(fld('Extra Child (Without Bed)',inp(rateEditSt.extraChildNB,function(v){rateEditSt.extraChildNB=v;},'number')));
        card.appendChild(fld('Extra Mattress',inp(rateEditSt.extraMattress,function(v){rateEditSt.extraMattress=v;},'number')));
        card.appendChild(fld('Remarks',inp(rateEditSt.remarks,function(v){rateEditSt.remarks=v;},'text')));
        var editBtnRow=el('div');editBtnRow.style.cssText='display:flex;gap:8px;margin-top:8px';
        editBtnRow.appendChild(btn('Save','btn bg sm',function(){handleRateEditSave(r);}));
        editBtnRow.appendChild(btn('Cancel','btn bm sm',cancelRateEdit));
        card.appendChild(editBtnRow);
        rateListWrap.appendChild(card);
        return;
      }

      card.innerHTML='<div style="font-weight:700;font-size:13px">'+r.hotelName+'</div>'
        +'<div style="font-size:11px;color:#8A8090;margin-top:3px">📍 '+(r.city||'—')+' • '+(r.roomCategory||'—')+' • '+(r.mealPlan||'—')+'</div>'
        +'<div style="font-size:12px;margin-top:6px">Room Rate: <b>'+window.fmt(r.roomRate)+'</b> &nbsp; Ex.Adult: '+window.fmt(r.extraAdult)+' &nbsp; CWB: '+window.fmt(r.extraChildWB)+' &nbsp; CNB: '+window.fmt(r.extraChildNB)+'</div>'
        +(r.remarks?'<div style="font-size:11px;color:#8A8090;margin-top:4px">📝 '+r.remarks+'</div>':'');
      var actRow=el('div');actRow.style.cssText='display:flex;gap:8px;margin-top:8px';
      var editBtn=btn('✏️ Edit','btn sm bn',function(){startRateEdit(r);});
      var rmBtn=btn('Remove','btn sm or',function(){
        // Refinement #4: delete always requires confirmation.
        confirmDialog('Delete rate for "'+r.hotelName+'" — '+(r.city||'—')+' • '+(r.roomCategory||'—')+' • '+(r.mealPlan||'—')+'? This cannot be undone.',function(){
          deleteHotelRateManual(r.id);
          renderRateList();
          toast('🗑️ Rate deleted');
        });
      });
      actRow.appendChild(editBtn);actRow.appendChild(rmBtn);
      card.appendChild(actRow);
      rateListWrap.appendChild(card);
    });
  }
  renderRateList();

  return wrap;
}

      var restoreBtn=btn('↩️ Restore','btn sm gn',function(){

        });

      restoreBtn.style.flex='1';
      var purgeBtn=btn('Delete Forever','btn sm or',function(){
        confirmDialog('Permanently delete "'+(bk.guestName||t.quotNo)+'" from Trash? This cannot be undone.',function(){

// ══════════════════════════════════════════════════════════════
//  LOCAL SINGLE-USER LOGIN (NEW — Phase: Auth)
//  100% offline. No backend, no Netlify env vars, no Firebase.
//  Uses only: localStorage + Web Crypto SHA-256.
//  This entire block is additive and self-contained — it does not
//  read or write any booking/hotel/template/sync data, and does
//  not call or modify any existing CRM function. It only wraps the
//  single existing `boot()` call at the very bottom of this file
//  (see "BOOT" section) so the CRM cannot render until the local
//  user is authenticated.
// ══════════════════════════════════════════════════════════════
var MAUTH = (function(){
  var HASH_KEY    = 'mishriAuth_hash_v1';     // SHA-256 hex of password
  var SESSION_KEY = 'mishriAuth_session_v1';  // {exp: ms timestamp}
  var ATTEMPT_KEY = 'mishriAuth_attempts_v1'; // {count, lockUntil}
  var RECOVERY_KEY= 'mishriAuth_recovery_hash_v1'; // SHA-256 hex of Recovery Key (NEW)
  var SESSION_MS  = 12*60*60*1000;            // 12 hour session
  var LOCK_MS     = 15*60*1000;               // 15 minute lockout
  var MAX_ATTEMPTS= 5;

  function sha256Hex(str){
    var enc=new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256',enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }
  function getHash(){ try{return localStorage.getItem(HASH_KEY);}catch(e){return null;} }
  function setHash(h){ try{localStorage.setItem(HASH_KEY,h);}catch(e){} }
  function getSession(){
    try{
      var raw=localStorage.getItem(SESSION_KEY); if(!raw) return null;
      var s=JSON.parse(raw);
      if(!s||!s.exp||Date.now()>s.exp) return null;
      return s;
    }catch(e){return null;}
  }
  function setSession(){ try{localStorage.setItem(SESSION_KEY,JSON.stringify({exp:Date.now()+SESSION_MS}));}catch(e){} }
  function clearSession(){ try{localStorage.removeItem(SESSION_KEY);}catch(e){} }
  function getAttempts(){
    try{
      var raw=localStorage.getItem(ATTEMPT_KEY); if(!raw) return {count:0,lockUntil:0};
      var a=JSON.parse(raw); return {count:a.count||0,lockUntil:a.lockUntil||0};
    }catch(e){return {count:0,lockUntil:0};}
  }
  function setAttempts(a){ try{localStorage.setItem(ATTEMPT_KEY,JSON.stringify(a));}catch(e){} }
  function clearAttempts(){ try{localStorage.removeItem(ATTEMPT_KEY);}catch(e){} }
  // NEW: Recovery Key hash — only the SHA-256 hash is ever stored, never the key itself
  function getRecoveryHash(){ try{return localStorage.getItem(RECOVERY_KEY);}catch(e){return null;} }
  function setRecoveryHash(h){ try{localStorage.setItem(RECOVERY_KEY,h);}catch(e){} }

  return {sha256Hex:sha256Hex,getHash:getHash,setHash:setHash,getSession:getSession,setSession:setSession,
    clearSession:clearSession,getAttempts:getAttempts,setAttempts:setAttempts,clearAttempts:clearAttempts,
    getRecoveryHash:getRecoveryHash,setRecoveryHash:setRecoveryHash,
    SESSION_MS:SESSION_MS,LOCK_MS:LOCK_MS,MAX_ATTEMPTS:MAX_ATTEMPTS,HASH_KEY:HASH_KEY,SESSION_KEY:SESSION_KEY};
})();

// ── shared inline style strings (kept local to this block only) ──
var MAUTH_INPUT_CSS='width:100%;padding:12px 14px;border-radius:8px;border:1.5px solid #2A2D3A;background:#1A1D27;color:#E8E0D0;font-size:14px;margin-bottom:12px;box-sizing:border-box';
var MAUTH_BTN_CSS='width:100%;padding:12px;border-radius:8px;border:none;background:#D4A843;color:#1a1d27;font-weight:700;font-size:14px;cursor:pointer';

// ══════════════════════════════════════════════════════════════
//  AUTH UI POLISH — Show/Hide Password (UI ONLY)
//  mAuthPwField() renders a password <input> wrapped with an eye
//  toggle icon, using the exact same MAUTH_INPUT_CSS look every auth
//  field already has (MAUTH_INPUT_CSS itself is untouched — non-
//  password fields like the Recovery Key input are unaffected).
//  mAuthWireEyeToggles() only ever flips input.type between
//  'password' and 'text' — the browser's own native masking. It does
//  not read, copy, store, or transform the value in any way, and does
//  not touch sha256Hex(), MAUTH.*, session/lockout/recovery logic, or
//  the value the rest of each screen's own submit handler reads.
// ══════════════════════════════════════════════════════════════
function mAuthPwField(id,placeholder){
  return '<div style="position:relative;margin-bottom:12px">'
    +'<input type="password" id="'+id+'" placeholder="'+placeholder+'" style="'+MAUTH_INPUT_CSS+';margin-bottom:0;padding-right:42px">'
    +'<span class="mAuthEye" data-for="'+id+'" title="Show/Hide password" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;line-height:1;color:#5C5468;user-select:none">\ud83d\udc41</span>'
    +'</div>';
}
function mAuthWireEyeToggles(){
  document.querySelectorAll('.mAuthEye').forEach(function(icon){
    if(icon._wired) return;
    icon._wired=true;
    icon.addEventListener('click',function(){
      var inp=document.getElementById(icon.dataset.for);
      if(!inp) return;
      var willShow=inp.type==='password';
      inp.type=willShow?'text':'password'; // UI-only toggle; the entered value never changes
      icon.style.color=willShow?'#D4A843':'#5C5468';
    });
  });
}

function mAuthShell(html){
  var old=document.getElementById('mAuthScreen'); if(old) old.remove();
  var wrap=document.createElement('div');
  wrap.id='mAuthScreen';
  wrap.style.cssText='position:fixed;inset:0;background:#0F1117;z-index:999999;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto';
  wrap.innerHTML=html;
  document.body.appendChild(wrap);
  return wrap;
}

// First-time setup: create + confirm password, and create + confirm a
// 6-digit Security PIN (replaces the old Recovery Key generation/display
// flow entirely — see V2.4 audit). Only SHA-256(PIN) is ever stored, via
// the SAME MAUTH.setRecoveryHash()/mishriAuth_recovery_hash_v1 used
// before — no new localStorage key. If a recovery hash already exists
// (e.g. this is a Path B reset), it is safely overwritten with the new
// PIN's hash, exactly like the password hash already is today.
function mAuthShowSetup(onDone){
  if(!window.crypto||!window.crypto.subtle){ mAuthShell('<div style="color:#E74C3C;text-align:center;max-width:320px">This browser does not support the Web Crypto API (SHA-256), or the app is not loaded over HTTPS/localhost. Login cannot be set up.</div>'); return; }
  var wrap=mAuthShell(
    '<div style="width:100%;max-width:360px;text-align:center">'
    +'<div style="font-size:40px;margin-bottom:6px">🔐</div>'
    +'<div style="font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:900;color:#D4A843;margin-bottom:4px">Mishri Holidays</div>'
    +'<div style="font-size:12px;color:#8A8090;margin-bottom:22px">First time setup — create a login password</div>'
    +'<div id="mAuthErr" style="color:#E74C3C;font-size:12px;margin-bottom:12px"></div>'
    +mAuthPwField('mAuthP1','New password (min 4 characters)')
    +mAuthPwField('mAuthP2','Confirm password')
    +'<div style="font-size:11.5px;color:#8A8090;margin:18px 0 8px;text-align:left">Create a 6-digit Security PIN — used only if you forget your password.</div>'
    +'<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mAuthPin1" placeholder="6-digit Security PIN" style="'+MAUTH_INPUT_CSS+'letter-spacing:4px;text-align:center">'
    +'<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mAuthPin2" placeholder="Confirm Security PIN" style="'+MAUTH_INPUT_CSS+'letter-spacing:4px;text-align:center">'
    +'<button id="mAuthSetupBtn" style="'+MAUTH_BTN_CSS+'">Set Password &amp; Continue</button>'
    +'<div style="font-size:10.5px;color:#5C5468;margin-top:14px;line-height:1.5">Only a one-way SHA-256 hash of your password and PIN is saved on this device (localStorage). Neither is ever stored in plain text, and nothing is sent over the network.</div>'
    +'</div>'
  );
  mAuthWireEyeToggles();
  var p1=document.getElementById('mAuthP1'),p2=document.getElementById('mAuthP2');
  var pin1=document.getElementById('mAuthPin1'),pin2=document.getElementById('mAuthPin2');
  var btn=document.getElementById('mAuthSetupBtn'),err=document.getElementById('mAuthErr');
  function digitsOnly(inp){ inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,6); }
  pin1.oninput=function(){ digitsOnly(pin1); };
  pin2.oninput=function(){ digitsOnly(pin2); };
  function go(){
    var a=p1.value,b=p2.value,pa=pin1.value,pb=pin2.value;
    err.textContent='';
    if(!a||a.length<4){ err.textContent='Password must be at least 4 characters.'; return; }
    if(a!==b){ err.textContent='Passwords do not match.'; return; }
    if(!/^[0-9]{6}$/.test(pa)){ err.textContent='Security PIN must be exactly 6 digits (numbers only).'; return; }
    if(pa!==pb){ err.textContent='Security PIN entries do not match.'; return; }
    btn.disabled=true; btn.textContent='Saving...';
    MAUTH.sha256Hex(a).then(function(hash){
      MAUTH.setHash(hash);
      MAUTH.sha256Hex(pa).then(function(pHash){
        MAUTH.setRecoveryHash(pHash); // overwrites any prior recovery/PIN hash, same as before
        MAUTH.clearAttempts();
        MAUTH.setSession();
        wrap.remove();
        onDone();
      });
    });
  }
  btn.onclick=go;
  pin2.onkeydown=function(e){if(e.key==='Enter')go();};
  pin1.onkeydown=function(e){if(e.key==='Enter')pin2.focus();};
  p2.onkeydown=function(e){if(e.key==='Enter')pin1.focus();};
  p1.onkeydown=function(e){if(e.key==='Enter')p2.focus();};
  p1.focus();
}

// Locked-out screen with live countdown
function mAuthShowLocked(lockUntil,onDone){
  var wrap=mAuthShell(
    '<div style="width:100%;max-width:340px;text-align:center">'
    +'<div style="font-size:40px;margin-bottom:6px">⛔</div>'
    +'<div style="font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:900;color:#D4A843;margin-bottom:4px">Mishri Holidays</div>'
    +'<div style="font-size:12px;color:#E74C3C;margin-bottom:6px">Too many wrong attempts</div>'
    +'<div style="font-size:12px;color:#8A8090;margin-bottom:18px">Login locked. Try again in <span id="mAuthCountdown" style="color:#E8E0D0;font-weight:700">--:--</span></div>'
    +'</div>'
  );
  var el=document.getElementById('mAuthCountdown');
  var timer=setInterval(function(){
    var remain=lockUntil-Date.now();
    if(remain<=0){
      clearInterval(timer);
      MAUTH.clearAttempts();
      if(document.getElementById('mAuthScreen')) mAuthShowLogin(null,onDone);
      return;
    }
    var mm=Math.floor(remain/60000),ss=Math.floor((remain%60000)/1000);
    if(el) el.textContent=mm+':'+(ss<10?'0':'')+ss;
  },250);
}

// Normal login screen
// NEW: Forgot Password — step 1, enter Recovery Key
function mAuthShowForgotEnterKey(onDone){
  if(!MAUTH.getRecoveryHash()){
    // Backward compatibility: logins with no Security PIN on file
    // (e.g. created before this feature existed). Say so plainly instead
    // of breaking.
    var noKeyWrap=mAuthShell(
      '<div style="width:100%;max-width:340px;text-align:center">'
      +'<div style="font-size:40px;margin-bottom:6px">⚠️</div>'
      +'<div style="font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:900;color:#D4A843;margin-bottom:4px">Mishri Holidays</div>'
      +'<div style="font-size:12.5px;color:#8A8090;margin-bottom:20px;line-height:1.5">No Security PIN is on file for this login, so password reset via Security PIN is not available.</div>'
      +'<button id="mAuthNoKeyReset" style="'+MAUTH_BTN_CSS+'">Reset Login Password Instead</button>'
      +'<div id="mAuthForgotBack" style="margin-top:14px;font-size:12px;color:#8A8090;cursor:pointer;text-decoration:underline">Back to Login</div>'
      +'</div>'
    );
    document.getElementById('mAuthNoKeyReset').onclick=function(){ mAuthShowResetNoRecovery(onDone); };
    document.getElementById('mAuthForgotBack').onclick=function(){ mAuthShowLogin(null,onDone); };
    return;
  }
  // Shared lockout check — same MAUTH.getAttempts()/MAX_ATTEMPTS/LOCK_MS
  // bucket as the main password screen (mAuthShowLogin). A user already
  // locked out from wrong passwords cannot bypass it by trying PIN guesses
  // here instead, and vice versa.
  var att=MAUTH.getAttempts();
  if(att.lockUntil && Date.now()<att.lockUntil){ mAuthShowLocked(att.lockUntil,onDone); return; }
  if(!window.crypto||!window.crypto.subtle){ mAuthShell('<div style="color:#E74C3C;text-align:center;max-width:320px">This browser does not support the Web Crypto API (SHA-256), or the app is not loaded over HTTPS/localhost. Cannot verify Security PIN.</div>'); return; }
  var wrap=mAuthShell(
    '<div style="width:100%;max-width:360px;text-align:center">'
    +'<div style="font-size:40px;margin-bottom:6px">🔢</div>'
    +'<div style="font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:900;color:#D4A843;margin-bottom:4px">Forgot Password</div>'
    +'<div style="font-size:12px;color:#8A8090;margin-bottom:20px">Enter your 6-digit Security PIN to reset your password</div>'
    +'<div id="mAuthFgErr" style="color:#E74C3C;font-size:12px;margin-bottom:12px"></div>'
    +'<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mAuthFgKey" placeholder="6-digit Security PIN" style="'+MAUTH_INPUT_CSS+'letter-spacing:4px;text-align:center">'
    +'<button id="mAuthFgVerify" style="'+MAUTH_BTN_CSS+'">Verify Security PIN</button>'
    +'<div id="mAuthFgBack" style="margin-top:14px;font-size:12px;color:#8A8090;cursor:pointer;text-decoration:underline">Back to Login</div>'
    +'</div>'
  );
  var keyInput=document.getElementById('mAuthFgKey'),btn=document.getElementById('mAuthFgVerify'),err=document.getElementById('mAuthFgErr');
  keyInput.oninput=function(){ keyInput.value=keyInput.value.replace(/[^0-9]/g,'').slice(0,6); };
  function verify(){
    var entered=keyInput.value||'';
    err.textContent='';
    if(!/^[0-9]{6}$/.test(entered)){ err.textContent='Enter exactly 6 digits.'; return; }
    btn.disabled=true; btn.textContent='Verifying...';
    MAUTH.sha256Hex(entered).then(function(hash){
      if(hash===MAUTH.getRecoveryHash()){
        MAUTH.clearAttempts(); // same shared counter the password screen uses
        wrap.remove();
        mAuthShowForgotNewPassword(onDone);
      } else {
        var a=MAUTH.getAttempts();
        a.count=(a.count||0)+1;
        if(a.count>=MAUTH.MAX_ATTEMPTS){
          a.lockUntil=Date.now()+MAUTH.LOCK_MS; a.count=0;
          MAUTH.setAttempts(a);
          wrap.remove();
          mAuthShowLocked(a.lockUntil,onDone);
        } else {
          MAUTH.setAttempts(a);
          btn.disabled=false; btn.textContent='Verify Security PIN';
          err.textContent='Invalid Security PIN. '+(MAUTH.MAX_ATTEMPTS-a.count)+' attempt(s) remaining before lockout.';
        }
      }
    });
  }
  btn.onclick=verify;
  keyInput.onkeydown=function(e){if(e.key==='Enter')verify();};
  document.getElementById('mAuthFgBack').onclick=function(){ mAuthShowLogin(null,onDone); };
  keyInput.focus();
}

function mAuthShowLogin(msg,onDone){
  var att=MAUTH.getAttempts();
  if(att.lockUntil && Date.now()<att.lockUntil){ mAuthShowLocked(att.lockUntil,onDone); return; }
  if(!window.crypto||!window.crypto.subtle){ mAuthShell('<div style="color:#E74C3C;text-align:center;max-width:320px">This browser does not support the Web Crypto API (SHA-256), or the app is not loaded over HTTPS/localhost. Cannot verify login.</div>'); return; }
  var wrap=mAuthShell(
    '<div style="width:100%;max-width:340px;text-align:center">'
    +'<div style="font-size:40px;margin-bottom:6px">✈️</div>'
    +'<div style="font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:900;color:#D4A843;margin-bottom:4px">Mishri Holidays</div>'
    +'<div style="font-size:12px;color:#8A8090;margin-bottom:22px">Enter password to continue</div>'
    +(msg?'<div style="color:#E74C3C;font-size:12px;margin-bottom:12px">'+msg+'</div>':'')
    +mAuthPwField('mAuthPass','Password')
    +'<button id="mAuthLoginBtn" style="'+MAUTH_BTN_CSS+'">Unlock</button>'
    +'<div id="mAuthForgotLink" style="margin-top:14px;font-size:12px;color:#8A8090;cursor:pointer;text-decoration:underline">Forgot Password?</div>'
    +'<div id="mAuthNoRecLink" style="margin-top:8px;font-size:11.5px;color:#6B6474;cursor:pointer;text-decoration:underline">No Security PIN? Reset Login</div>'
    +'</div>'
  );
  mAuthWireEyeToggles();
  var input=document.getElementById('mAuthPass'),btn=document.getElementById('mAuthLoginBtn');
  document.getElementById('mAuthForgotLink').onclick=function(){ mAuthShowForgotEnterKey(onDone); };
  document.getElementById('mAuthNoRecLink').onclick=function(){ mAuthShowResetNoRecovery(onDone); };
  function attempt(){
    var pw=input.value; if(!pw) return;
    btn.disabled=true; btn.textContent='Checking...';
    MAUTH.sha256Hex(pw).then(function(hash){
      if(hash===MAUTH.getHash()){
        MAUTH.clearAttempts();
        MAUTH.setSession();
        wrap.remove();
        onDone();
      } else {
        var a=MAUTH.getAttempts();
        a.count=(a.count||0)+1;
        if(a.count>=MAUTH.MAX_ATTEMPTS){
          a.lockUntil=Date.now()+MAUTH.LOCK_MS; a.count=0;
          MAUTH.setAttempts(a);
          mAuthShowLocked(a.lockUntil,onDone);
        } else {
          MAUTH.setAttempts(a);
          mAuthShowLogin('Wrong password. '+(MAUTH.MAX_ATTEMPTS-a.count)+' attempt(s) remaining before lockout.',onDone);
        }
      }
    });
  }
  btn.onclick=attempt;
  input.onkeydown=function(e){if(e.key==='Enter')attempt();};
  input.focus();
}

// Entry point: replaces the plain boot() call at the bottom of this file
function mAuthGuard(onDone){
  var sess=MAUTH.getSession();
  if(sess){ onDone(); return; }
  // NEW: after an inactivity auto-logout, mAuthInactivityLogout() sets this
  // flag right before reloading — surface the message once, then clear it.
  var inactivityMsg=null;
  try{
    if(sessionStorage.getItem('mishriAuth_logout_reason')==='inactivity'){
      inactivityMsg='Session expired due to inactivity. Please login again.';
      sessionStorage.removeItem('mishriAuth_logout_reason');
    }
  }catch(e){}
  var att=MAUTH.getAttempts();
  if(att.lockUntil && Date.now()<att.lockUntil){ mAuthShowLocked(att.lockUntil,onDone); return; }
  if(!MAUTH.getHash()){ mAuthShowSetup(onDone); }
  else { mAuthShowLogin(inactivityMsg,onDone); }
}

function mAuthLogout(){
  MAUTH.clearSession();
  location.reload();
}

// ══════════════════════════════════════════════════════════════
//  NEW: AUTO LOGOUT AFTER 30 MINUTES OF INACTIVITY
//  Only acts while a session is actually active (mAuthResetIdleTimer
//  is a no-op if MAUTH.getSession() is null, e.g. while the login/
//  setup/forgot-password screens are showing). A full page reload is
//  used to expire the session cleanly — this does not call boot()/
//  init() a second time, so no existing timers/intervals in the CRM
//  (dashboard, sync, etc.) are duplicated or otherwise touched.
// ══════════════════════════════════════════════════════════════
var MAUTH_IDLE_MS=30*60*1000; // 30 minutes
var mAuthIdleTimer=null;
function mAuthResetIdleTimer(){
  if(!MAUTH.getSession()) return;
  if(mAuthIdleTimer) clearTimeout(mAuthIdleTimer);
  mAuthIdleTimer=setTimeout(mAuthInactivityLogout,MAUTH_IDLE_MS);
}
function mAuthInactivityLogout(){
  if(!MAUTH.getSession()) return; // already logged out some other way
  MAUTH.clearSession();
  try{sessionStorage.setItem('mishriAuth_logout_reason','inactivity');}catch(e){}
  location.reload();
}
['mousemove','mousedown','click','keydown','touchstart','scroll'].forEach(function(evt){
  window.addEventListener(evt,mAuthResetIdleTimer,{passive:true});
});

    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
      .then(function(r){return r.json();})
      .then(function(res){
        if(res.ok&&res.token){
          APP.authToken=res.token;LS.s('authToken',res.token);

  passInput.onkeydown=function(e){if(e.key==='Enter')attempt();};
  passInput.focus();

<!-- ============================================================================
     V2.3 STABLE — KEYBOARD FAST ENTRY MODE  (additive, desktop-only)
     ----------------------------------------------------------------------------
     Pure UX/productivity layer. Does not read from or write to the booking
     model, does not call calcOpt()/Auto Fill/Hotel Rate Master/Payment/
     Revision/Documents/Sync/LocalStorage, and does not add, remove, or
     rename any field, id, or existing event handler. It only listens for the
     ENTER/SHIFT+ENTER keys on fields that already exist and moves keyboard
     focus to another field that already exists. See SKILL/testing notes
     delivered alongside this file for the full regression checklist.
     ============================================================================ -->
<script>
(function(){
  'use strict';

  // ---- Rule: Desktop only. Mobile behaviour must remain unchanged. ----------
  // Matches the app's own existing 768px desktop/mobile breakpoint (see the
  // @media(min-width:768px)/@media(max-width:768px) rules already in <style>).
  function isDesktop(){
    return window.innerWidth>768 &&
      (!window.matchMedia || window.matchMedia('(hover:hover) and (pointer:fine)').matches);
  }

  // Fields eligible for fast-entry keyboard navigation. Explicitly excludes:
  //  - checkboxes/radios/file/hidden/buttons (Enter has no meaningful "next
  //    field" role there and native behaviour must stay untouched)
  //  - input[type=date] — the app's dateInp()/paymentDateInp() helpers pair
  //    a visible text input with a hidden (opacity:0) native date-picker
  //    input for tap-to-pick support. Only the visible text input should be
  //    part of the keyboard flow; the hidden picker input is intentionally
  //    skipped here so Enter doesn't "jump" onto an invisible field. This
  //    changes nothing about how that hidden input works — it's simply left
  //    out of our own separate keyboard-flow list.
  var FIELD_SELECTOR='input:not([type=hidden]):not([type=checkbox]):not([type=radio])'
    +':not([type=file]):not([type=button]):not([type=submit]):not([type=date]), '
    +'select, textarea';

  function isEligible(node){
    if(!node || node.nodeType!==1 || !node.matches) return false;
    if(!node.matches(FIELD_SELECTOR)) return false;
    if(node.disabled || node.readOnly) return false;
    // offsetParent is null for display:none elements (itself or an ancestor,
    // e.g. the mobile-only hotel cards / hidden Lost-Reason block / the
    // desktop table on a narrow viewport) — a cheap, reliable "is this
    // actually shown right now" check that needs no extra bookkeeping.
    if(node.offsetParent===null) return false;
    return true;
  }

  // Recomputed on every keypress (never cached) since #content is fully
  // re-rendered on every tab/page switch and hotel/vehicle/payment rows can
  // be added or removed at any time.
  function navigableFields(container){
    var all=container.querySelectorAll(FIELD_SELECTOR);
    var out=[];
    for(var i=0;i<all.length;i++){ if(isEligible(all[i])) out.push(all[i]); }
    return out;
  }

  function focusAndSelect(f){
    f.focus();
    if(f.tagName==='INPUT' && /^(text|number|email|tel)$/.test(f.type)){
      try{ f.select(); }catch(e){}
    }
  }

  function goToField(container,current,dir){
    var fields=navigableFields(container);   // fresh query — never cached
    var idx=fields.indexOf(current);
    if(idx===-1) return;
    var next=fields[idx+dir];
    if(next) focusAndSelect(next);
  }

  // ---- Single delegated listener on #content — attached exactly once. -----
  // #content itself is never destroyed or recreated by the app (only its
  // innerHTML is cleared/rebuilt on every tab/page switch — see
  // renderTabContent()/sw()), so one listener here survives every re-render
  // for free. No re-attachment, no MutationObserver, no polling needed.
  // We deliberately do NOT keep any reference to the fields inside it —
  // only this one stable parent-container reference, which is required for
  // delegation and is re-queried for its children fresh on every keypress.
  var contentEl=document.getElementById('content');
  if(contentEl){
    contentEl.addEventListener('keydown', function(e){
      if(e.key!=='Enter') return;
      if(!isDesktop()) return;                      // Rule: desktop only

      var t=e.target;
      if(!t || !t.matches) return;

      // Rule 7: Textarea keeps its native "Enter = new line" behaviour, and
      // is not part of the fast-entry navigation chain at all.
      if(t.tagName==='TEXTAREA') return;

      // Rule 6: hidden / disabled / readonly fields are skipped automatically
      // (isEligible() re-checks offsetParent/disabled/readOnly live, every time).
      if(!isEligible(t)) return;

      var dir=e.shiftKey ? -1 : 1;                  // Rule 2: Shift+Enter = previous

      // Fields with a datalist (Hotel Name, Room Category, Guest Name,
      // Vehicle Type/No.) can show a native browser suggestion popup. We
      // don't preventDefault for these so the browser's own
      // Enter-selects-suggestion behaviour stays completely intact; we just
      // queue our focus move for the next tick, after the browser has
      // finished handling this Enter. contentEl is re-queried fresh inside
      // goToField() when this timeout fires, same as the synchronous path.
      if(t.hasAttribute('list')){
        setTimeout(function(){ goToField(contentEl,t,dir); },0);
        return;
      }

      // Everything else (plain text fields, number fields, the visible half
      // of date fields, and dropdowns) — Rules 1,3,4,5,8,9,10,11: Enter
      // behaves like Tab (Shift+Enter like Shift+Tab) and never triggers a
      // submit. Arrow-key browsing of a focused <select>'s options is
      // native browser behaviour and is completely untouched here.
      e.preventDefault();
      goToField(contentEl,t,dir);
    }, true);
  }
})();
</script>

<!-- ============================================================================
     GLOBAL HOTEL SEARCH — search hotels from any tab, without opening the
     Hotels tab. Purely additive and read-only:
       - Does not call saveHotels(), saveHotelRates(), importHotelRates(),
         normalizeHotelRow(), or normalizeHotelRateRow() — no write path at all.
       - Only reads APP.hotels / APP.hotelRates, which the existing app code
         already loads and keeps up to date; this script never fetches,
         mutates, or persists that data itself.
       - Independent of the existing #globalSearchBtn/#globalSearchOverlay
         (booking search) — that feature's HTML, CSS, and JS are untouched.
     ============================================================================ -->
<script>
(function(){
  'use strict';

  var overlay=document.getElementById('hotelSearchOverlay');
  var input=document.getElementById('hotelSearchInput');
  var results=document.getElementById('hotelSearchResults');
  var openBtn=document.getElementById('hotelSearchBtn');
  var closeBtn=document.getElementById('hotelSearchClose');
  if(!overlay||!input||!results||!openBtn||!closeBtn) return;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Read-only lookup: does this hotel have any Hotel Rate Master entry?
  // Mirrors the same name match findMatchingRate() already uses — does not
  // call findMatchingRate() itself (that requires city/roomCategory/mealPlan
  // too, which a directory-level search doesn't have), just a lighter,
  // display-only existence check over the same in-memory list.
  function hasRatesOnFile(hotelName){
    var list=APP.hotelRates||[];
    var hn=(hotelName||'').trim().toLowerCase();
    if(!hn) return false;
    for(var i=0;i<list.length;i++){
      if((list[i].hotelName||'').trim().toLowerCase()===hn) return true;
    }
    return false;
  }

  function renderResults(query){
    var list=APP.hotels||[];
    var q=(query||'').trim().toLowerCase();
    var filtered=!q ? list : list.filter(function(h){
      return (h.name||'').toLowerCase().indexOf(q)>=0 ||
             (h.place||'').toLowerCase().indexOf(q)>=0 ||
             (h.cat||'').toLowerCase().indexOf(q)>=0 ||
             (h.ph||'').toLowerCase().indexOf(q)>=0 ||
             (h.em||'').toLowerCase().indexOf(q)>=0;
    });

    if(!list.length){
      results.innerHTML='<div class="hs-hint">No hotels in the directory yet.<br>Add hotels from the Hotels tab, or import an Excel file there.</div>';
      return;
    }
    if(!filtered.length){
      results.innerHTML='<div class="hs-hint">No hotels match "'+esc(query)+'".</div>';
      return;
    }

    results.innerHTML=filtered.map(function(h){
      var metaParts=[];
      if(h.place) metaParts.push(esc(h.place));
      if(h.cat) metaParts.push(esc(h.cat));
      if(h.stars) metaParts.push(h.stars+'★');
      var meta=metaParts.join(' • ');
      var contactParts=[];
      if(h.ph) contactParts.push('<span>📞 '+esc(h.ph)+'</span>');
      if(h.em) contactParts.push('<span>✉️ '+esc(h.em)+'</span>');
      var contact=contactParts.length?'<div class="hs-contact">'+contactParts.join('')+'</div>':'';
      var tag=hasRatesOnFile(h.name)?'<div class="hs-tag">💰 Rates on file</div>':'';
      return '<div class="hs-card">'
        +'<div class="hs-name">'+esc(h.name)+'</div>'
        +(meta?'<div class="hs-meta">'+meta+'</div>':'')
        +contact
        +tag
        +'</div>';
    }).join('');
  }

  function openHotelSearch(){
    overlay.classList.add('show');
    input.value='';
    renderResults('');
    setTimeout(function(){ input.focus(); },0); // after the overlay is visible
  }
  function closeHotelSearch(){
    overlay.classList.remove('show');
  }

  openBtn.addEventListener('click',openHotelSearch);
  closeBtn.addEventListener('click',closeHotelSearch);
  input.addEventListener('input',function(){ renderResults(input.value); });
  overlay.addEventListener('click',function(e){ if(e.target===overlay) closeHotelSearch(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && overlay.classList.contains('show')) closeHotelSearch();
  });
})();
</script>
</body>
</html>
