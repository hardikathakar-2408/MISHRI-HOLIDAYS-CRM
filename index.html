// ── SERVER BASE URL ──────────────────────────────────────────
function getBase(){
  if(APP.useRelative) return ""; // Netlify (cloud) or desktop serving app on :7842 — same-origin
  if(APP.serverIp) return "http://"+APP.serverIp+":7842"; // LAN desktop server
  return "";
}

// ── AUTHENTICATED API FETCH ───────────────────────────────────
// Adds the login token (cloud mode only) to every API call, and
// forces re-login if the server says the token is invalid/expired.
function apiFetch(path, opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  if(APP.useRelative && APP.authToken){
    opts.headers['Authorization']='Bearer '+APP.authToken;
  }
  return fetch(getBase()+path, opts).then(function(r){
    if(r.status===401){
      APP.authToken=null;LS.s('authToken',null);
      showLoginScreen();
      throw new Error('unauthorized');
    }
    return r;
  });
}

// Load bookings: server if online, else localStorage
function loadBookings(){
  if(APP.online){
    return apiFetch('/api/bookings').then(function(r){return r.json();})
      .then(function(list){
        APP.bookings=normalizeBookings(list);
        LS.s('bookings',APP.bookings); // mirror to local
        return APP.bookings;
      }).catch(function(){
        APP.bookings=normalizeBookings(LS.g('bookings'));
        return APP.bookings;
      });
  } else {
    APP.bookings=normalizeBookings(LS.g('bookings'));
    return Promise.resolve(APP.bookings);
  }
}

// Save one booking: server + local mirror
function saveBooking(b){
  if(!b.guestName||!b.guestName.trim()){
    toast('⚠ Guest Name is required before saving',false);
    return Promise.reject(new Error('validation: guestName required'));
  }
  normalizeBooking(b);
  b.updatedAt=now();
  // Speed optimization: remember this booking's GST / Markup / Misc values (from
  // Option 1) as the "last used" defaults for the NEXT NEW booking (see newBk()/
  // lastFin()). Only ever read when newBk() runs, so it never touches or
  // overwrites this or any other EXISTING booking's own saved values.
  LS.s('lastFinancials',{mkPct:b.mkPct1||0,mkFixed:b.mkFixed1||0,misc:b.misc1||0,gstPct:b.gstPct1||0});
  // Always save to localStorage immediately
  var local=APP.bookings.slice();
  var idx=-1;
  for(var i=0;i<local.length;i++){if(local[i].quotNo===b.quotNo){idx=i;break;}}
  var copy=JSON.parse(JSON.stringify(b));
  if(idx>=0) local[idx]=copy; else local.unshift(copy);
  APP.bookings=local;
  LS.s('bookings',local);

  if(APP.online){
    return apiFetch('/api/bookings/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(copy)})
      .then(function(r){return r.json();})
      .then(function(){toast('✅ Saved — desktop file updated!');return true;})
      .catch(function(){toast('💾 Saved locally (server unreachable)');APP.pendingSync=true;return false;});
  } else {
    toast('💾 Saved locally — sync when online');
    APP.pendingSync=true;
    return Promise.resolve(false);
  }
}

// ── DELETE TOMBSTONES (offline-safe deletion) ────────────────
// A tombstone {quotNo, deletedAt} is recorded locally whenever a booking is
// deleted, and is sent along on every sync (see doSync) so the deletion is
// guaranteed to reach the server and stay applied — even if the deletion
// happened while offline, or the immediate /bookings/delete call above failed
// silently (as it always has). The server persists these permanently (see
// bookings-sync.js / _shared.js), so a deleted booking can never come back
// just because a sync response replaces APP.bookings. Cleared locally only
// once a sync actually succeeds, since the server has recorded the same
// tombstone by then and no longer needs it resent.
function getTombstones(){ return LS.g('deletedTombstones')||[]; }
function addTombstone(quotNo){
  if(!quotNo)return;
  var list=getTombstones().filter(function(t){return t.quotNo!==quotNo;});
  list.push({quotNo:quotNo,deletedAt:now()});
  LS.s('deletedTombstones',list);
}
function clearTombstones(){ LS.s('deletedTombstones',[]); }
function removeTombstone(quotNo){
  var list=getTombstones().filter(function(t){return t.quotNo!==quotNo;});
  LS.s('deletedTombstones',list);
}

// ══════════════════════════════════════════════════════════════
//  RECYCLE BIN — client-side-only soft-delete, 30-day retention.
//  Does NOT change deleteBooking()/saveBooking()/tombstone/sync logic
//  at all — it only wraps them: a full copy is stashed into
//  'trashedBookings' (localStorage/IndexedDB, this device only) BEFORE
//  the existing deleteBooking() runs unchanged, and restoring simply
//  calls the existing saveBooking() to re-upsert it normally.
// ══════════════════════════════════════════════════════════════
function getTrashedBookings(){ return LS.g('trashedBookings')||[]; }
var TRASH_RETENTION_DAYS=30;
function purgeExpiredTrash(){
  var cutoff=Date.now()-TRASH_RETENTION_DAYS*86400000;
  var all=getTrashedBookings();
  var kept=all.filter(function(t){
    var d=new Date(t.deletedAt).getTime();
    return isNaN(d)?true:d>=cutoff; // an unparsable date is kept rather than silently lost
  });
  if(kept.length!==all.length) LS.s('trashedBookings',kept);
  return kept;
}
function moveBookingToTrash(qn){
  var bk=(APP.bookings||[]).filter(function(b){return b.quotNo===qn;})[0];
  if(bk){
    var trash=getTrashedBookings().filter(function(t){return t.quotNo!==qn;}); // de-dupe safety
    trash.unshift({quotNo:qn,deletedAt:now(),booking:JSON.parse(JSON.stringify(bk))});
    LS.s('trashedBookings',trash);
  }
  deleteBooking(qn); // existing function, completely unchanged
}
function restoreBookingFromTrash(qn){
  var trash=getTrashedBookings();
  var entry=trash.filter(function(t){return t.quotNo===qn;})[0];
  if(!entry) return Promise.resolve(false);
  LS.s('trashedBookings',trash.filter(function(t){return t.quotNo!==qn;}));
  removeTombstone(qn); // so the next sync doesn't re-delete what we just restored
  return saveBooking(entry.booking).then(function(){return true;});
}

// ── TEMPLATE SYNC TOMBSTONES (Package Master + Itinerary Templates) ─────
// Parallel implementation of the exact same {id/quotNo, deletedAt} tombstone
// pattern used for Bookings just above — kept as its own separate set of
// functions (own LocalStorage keys, keyed by "kind") so the Bookings
// tombstone functions above are never read, modified, or shared by
// reference. kind is 'pkgTemplates' or 'itinTemplates'.
function getTemplateTombstones(kind){ return LS.g(kind+'Tombstones')||[]; }
function addTemplateTombstone(kind,id){
  if(id==null)return;
  var list=getTemplateTombstones(kind).filter(function(t){return t.id!==id;});
  list.push({id:id,deletedAt:now()});
  LS.s(kind+'Tombstones',list);
}
function clearTemplateTombstones(kind){ LS.s(kind+'Tombstones',[]); }
// For each item in the new list: if it's the exact same object reference it
// was in the previous list, its updatedAt is left untouched — every existing
// template add/edit/duplicate/delete call site (Package Master + Itinerary
// Templates screens) already only replaces the item(s) that actually
// changed, via .map()/.concat()/.push()/.filter(), and leaves everything
// else as the same reference, so this requires no change to any of those
// call sites. New/changed items get a fresh updatedAt. Any id present in
// prevList but missing from newList (i.e. deleted) is recorded as a
// tombstone, the same way Bookings deletes already are. Backward
// compatible: a template saved before this feature existed simply has no
// updatedAt yet — the merge on the server treats that as the oldest
// possible value, so it's never mistaken for "newer" but is also never
// dropped (see mergeTemplateList in templates-sync.js).
function stampAndTombstoneTemplates(kind,prevList,newList){
  var prevById={};
  (prevList||[]).forEach(function(p){ if(p&&p.id!=null) prevById[p.id]=p; });
  var seen={};
  var stamped=(newList||[]).map(function(item){
    if(!item) return item;
    seen[item.id]=true;
    if(prevById[item.id]===item) return item; // unchanged reference — leave as-is
    item.updatedAt=now();
    return item;
  });
  Object.keys(prevById).forEach(function(id){
    if(!seen[id]) addTemplateTombstone(kind,prevById[id].id);
  });
  return stamped;
}

// ── HOTEL MASTER SYNC TOMBSTONES (offline-safe Hotel Master sync) ───────
// Parallel implementation of the exact same {id, deletedAt} tombstone
// pattern used for Package/Itinerary Templates and Bookings above — kept as
// its own separate set of functions (own LocalStorage key 'hotelTombstones')
// so none of the Booking or Template tombstone functions above are read,
// modified, or shared by reference. This is what lets a hotel removed while
// offline stay removed everywhere, instead of being resurrected the next
// time some other device (still holding an older copy) syncs.
function getHotelTombstones(){ return LS.g('hotelTombstones')||[]; }
function addHotelTombstone(id){
  if(id==null)return;
  var list=getHotelTombstones().filter(function(t){return t.id!==id;});
  list.push({id:id,deletedAt:now()});
  LS.s('hotelTombstones',list);
}
function clearHotelTombstones(){ LS.s('hotelTombstones',[]); }
// Mirrors stampAndTombstoneTemplates() exactly (same "unchanged reference
// is left alone" check, same "new/changed item gets a fresh updatedAt",
// same "an id present before but missing now becomes a tombstone") but for
// the Hotel Master list. Kept as its own function so
// stampAndTombstoneTemplates / Package Master / Itinerary Templates are
// never touched by this feature. Every existing Hotel Master call site
// (Add / Edit / Remove / Excel-Import in bHotels()) already only replaces
// the item(s) that actually changed and leaves everything else as the same
// object reference, via .concat()/.map()/.filter()/.slice(), so this
// requires no change to any of those call sites — only to saveHotels()
// itself, which now runs every list through this before saving.
// Backward compatible: a hotel saved before this feature existed simply has
// no updatedAt yet — the merge on the server (see mergeHotelList in
// hotels-sync.js) treats that as the oldest possible value, so it's never
// mistaken for "newer" but is also never dropped.
function stampAndTombstoneHotels(prevList,newList){
  var prevById={};
  (prevList||[]).forEach(function(p){ if(p&&p.id!=null) prevById[p.id]=p; });
  var seen={};
  var stamped=(newList||[]).map(function(item){
    if(!item) return item;
    seen[item.id]=true;
    if(prevById[item.id]===item) return item; // unchanged reference — leave as-is
    item.updatedAt=now();
    return item;
  });
  Object.keys(prevById).forEach(function(id){
    if(!seen[id]) addHotelTombstone(prevById[id].id);
  });
  return stamped;
}

// Delete booking
function deleteBooking(qn){
  APP.bookings=APP.bookings.filter(function(b){return b.quotNo!==qn;});
  LS.s('bookings',APP.bookings);
  addTombstone(qn);
  if(APP.online){
    apiFetch('/api/bookings/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quotNo:qn})}).catch(function(){});
  }
  toast('Deleted');
}

// ── SYNC: send local → server, get merged back ──────────────
function doSync(silent){
  if(!APP.online){if(!silent)toast('Not connected to server',false);return Promise.resolve(false);}
  var local=LS.g('bookings')||[];
  var tombstones=getTombstones();
  if(!silent)toast('Syncing...');
  return apiFetch('/api/bookings/sync',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bookings:local,tombstones:tombstones})
  }).then(function(r){return r.json();})
  .then(function(res){
    if(res.ok&&res.bookings){
      var changed=JSON.stringify(res.bookings)!==JSON.stringify(APP.bookings);
      APP.bookings=normalizeBookings(res.bookings);
      LS.s('bookings',APP.bookings);
      APP.pendingSync=false;
      // The server has now durably recorded any pending deletions (tombstones)
      // sent above, so they no longer need to be resent on the next sync.
      clearTombstones();
      if(!silent){
        toast('✅ Synced! '+res.bookings.length+' bookings');
        go(APP.page);
      } else if(changed && (APP.page==='list'||APP.page==='dash')){
        // Refresh the currently visible screen quietly if new data arrived from desktop
        go(APP.page);
      }
      return true;
    }
    return false;
  }).catch(function(){if(!silent)toast('Sync failed',false);return false;});
}

// ── TEMPLATE SYNC: send local Package/Itinerary Templates → server, get
// merged back ── Mirrors doSync() immediately above (same shape: send
// local + tombstones, receive back the merged authoritative list, mirror
// it into LocalStorage, clear tombstones on success) but for Package
// Master + Itinerary Templates via the new /api/templates/sync endpoint.
// doSync() itself is not called or modified by this.
function doTemplateSync(silent){
  if(!APP.online) return Promise.resolve(false);
  // UI-only: remember whether there was actually anything pending BEFORE this
  // sync call, so the badge only animates to "Syncing..." when a real
  // upload is happening — not on every silent background tick that finds
  // nothing to send. This does not change what gets sent, how it's merged,
  // or when doTemplateSync itself runs; it only decides whether to touch
  // the badge.
  var hadPendingChanges=APP.templatesPendingSync;
  if(hadPendingChanges) setTemplateSyncStatus('syncing'); // UI-only — does not affect the request below
  var body={
    pkgTemplates:LS.g('pkgTemplates')||[],
    itinTemplates:LS.g('itinTemplates')||[],
    pkgTombstones:getTemplateTombstones('pkgTemplates'),
    itinTombstones:getTemplateTombstones('itinTemplates')
  };
  return apiFetch('/api/templates/sync',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();})
  .then(function(res){
    if(res&&res.ok){
      if(res.pkgTemplates){APP.pkgTemplates=res.pkgTemplates;LS.s('pkgTemplates',APP.pkgTemplates);}
      if(res.itinTemplates){APP.itinTemplates=res.itinTemplates;LS.s('itinTemplates',APP.itinTemplates);}
      // The server has now durably recorded any pending template deletions
      // (tombstones) sent above, so they no longer need to be resent.
      clearTemplateTombstones('pkgTemplates');
      clearTemplateTombstones('itinTemplates');
      APP.templatesPendingSync=false;
      if(hadPendingChanges) setTemplateSyncStatus('synced'); // UI-only — only animate if we actually had something to sync
      if(!silent) toast('✅ Templates synced!');
      return true;
    }
    if(hadPendingChanges) setTemplateSyncStatus('failed'); // UI-only — server responded but not ok
    return false;
  }).catch(function(){if(hadPendingChanges)setTemplateSyncStatus('failed');if(!silent)toast('Template sync failed',false);return false;});
}

// ── HOTEL MASTER SYNC: send local Hotel Master → server, get merged back ──
// Mirrors doTemplateSync() / doSync() immediately above (same shape: send
// local list + tombstones, receive back the merged authoritative list,
// mirror it into LocalStorage, clear tombstones only once the server has
// durably recorded them) but for the Hotel Master directory, via the new
// /api/hotels/sync endpoint (hotels-sync.js). Does not call, import, or
// modify doSync(), doTemplateSync(), bookings-sync.js, or templates-sync.js
// — kept fully independent so Booking Sync, Booking Logic and Package
// Master are never touched by this feature.
// On failure, hotelsPendingSync stays true and the tombstones are left
// un-cleared, so the very next backgroundSyncTick() (every 20s while the
// app is open) or reconnect resends the exact same pending changes — this
// is the "retry failed uploads" behaviour.
function doHotelSync(silent){
  if(!APP.online) return Promise.resolve(false);
  var body={
    hotels:LS.g('hotels')||APP.hotels||[],
    tombstones:getHotelTombstones()
  };
  return apiFetch('/api/hotels/sync',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();})
  .then(function(res){
    if(res&&res.ok&&res.hotels){
      APP.hotels=res.hotels;
      LS.s('hotels',APP.hotels);
      // The server has now durably recorded any pending hotel deletions
      // (tombstones) sent above, so they no longer need to be resent.
      clearHotelTombstones();
      APP.hotelsPendingSync=false;
      if(!silent) toast('✅ Hotels synced!');
      return true;
    }
    return false;
  }).catch(function(){if(!silent)toast('Hotel sync failed',false);return false;});
}

// ── EXPORT: copy all local data as JSON text ─────────────────
function doExport(){
  var local=LS.g('bookings')||[];
  if(local.length===0){toast('કોઈ data નથી export કરવા માટે',false);return;}
  var json=JSON.stringify({bookings:local,exportedAt:now(),source:'MishriCRM_mobile'});
  // Copy to clipboard
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){
      toast('✅ '+local.length+' bookings copied! હવે Desktop માં Import કરો');
    }).catch(function(){showExportText(json);});
  } else {
    showExportText(json);
  }
}

// Phase 1A/1B: brings any older booking record (saved before this update) up to the
// new data model with sensible defaults, and migrates the old 4-stage status values
// to their closest new-stage equivalent. Never overwrites fields that already exist,
// so nothing already saved is ever changed in meaning — only filled in where missing.
function normalizeBooking(b){
  if(!b) return b;
  if(b.status==='Quotation') b.status='Quotation Sent';
  else if(b.status==='Cancelled') b.status='Lost';
  else if(!b.status) b.status='New Inquiry';
  if(b.priority===undefined) b.priority='Medium';
  if(b.followUpDate===undefined) b.followUpDate='';
  if(b.followUpNotes===undefined) b.followUpNotes='';
  if(b.lostReason===undefined) b.lostReason='';
  if(b.lostReasonOther===undefined) b.lostReasonOther='';
  if(b.terms===undefined) b.terms=[];
  if(b.remarks===undefined) b.remarks='';
  // Vehicle Remarks (added on request, replacing the old hardcoded quotation
  // text — see vehTableHtml()). Self-heals old bookings with a blank default;
  // never overwrites anything already saved.
  if(b.vehicleRemarks===undefined) b.vehicleRemarks='';
  if(b.paymentPolicy===undefined) b.paymentPolicy='';
  // V2.5 — Cancellation Policy. Booking-level only (not part of Package
  // Templates, per approved scope). Same one-line self-heal pattern as
  // every other field here — plain string, blank default, never overwrites
  // an already-saved value.
  if(b.cancellationPolicy===undefined) b.cancellationPolicy='';
  // V2.4 TRIAL — DMC Quotation (Paste). Self-heals old bookings with a blank
  // default; never overwrites anything already saved. Same one-line pattern
  // as every other field above — plain string, no parsing, no new model.
  if(b.dmcQuoteRaw===undefined) b.dmcQuoteRaw='';
  // V2.6 — DMC Table Paste. Sanitized HTML (tables/bold/line breaks) when
  // the paste source provided text/html; stays blank when it didn't, in
  // which case b.dmcQuoteRaw (above) is what's used, exactly as before.
  if(b.dmcQuoteHtml===undefined) b.dmcQuoteHtml='';
  // DMC Billing Amount — manually entered only (never auto-calculated, never
  // touched by the DMC paste/HTML handlers or by calcOpt()). Self-heals old
  // bookings with a numeric 0 default; never overwrites anything already
  // saved. Same one-line pattern as every other field in this block.
  if(b.dmcBillingAmount===undefined) b.dmcBillingAmount=0;
  if(b.packageTemplateId===undefined) b.packageTemplateId=null;
  if(b.packageTemplateName===undefined) b.packageTemplateName='';
  // Installment Payment History — Phase 1: initialize ONLY when missing.
  // Any booking that already has a paymentHistory array (however it got
  // there) is left completely untouched — this never overwrites existing
  // payment history.
  if(b.paymentHistory===undefined) b.paymentHistory=[];
  // Supplier Payment Ledger — additive, manual-entry-only array, completely
  // separate from the Guest Payment History above. Self-heals ONLY when
  // missing; any booking that already has a supplierPayments array (however
  // it got there) is left completely untouched. Each entry is
  // {id, supplierName, supplierType, netPayable, payments:[{amount,date,mode,remarks}]}.
  // netPayable is a manual, NET (no-markup) figure — never derived from
  // calcOpt()/mkPct/mkFixed/gstPct, and never read by any costing, quotation,
  // voucher, invoice, receipt, or revision logic.
  if(b.supplierPayments===undefined) b.supplierPayments=[];
  // Booking Reference No. = Quotation No. (merged per user decision — the
  // quotation number is already permanent, unique and collision-checked, so
  // there's no need for a second, manually-typed reference number that could
  // drift out of sync / use an inconsistent prefix). Running this inside
  // normalizeBooking() means it self-heals on every load AND every save:
  // any booking's bookingRef (including old inconsistent values like
  // "Mishri-1645" or "MISH-2001") is overwritten with its own quotNo the
  // very next time this runs — a one-time cleanup that needs no separate
  // migration step, since loadBookings() persists the normalized list right
  // back to storage after calling this.
  if(b.quotNo) b.bookingRef=b.quotNo;
  return b;
}
function normalizeBookings(list){return (list||[]).map(normalizeBooking);}
</script>
<script>
// ══════════════════════════════════════════════════════════════
//  HOTEL / TEMPLATE DATA LAYER — pure data CRUD for Hotel Master,
//  Itinerary Templates, and Package Templates (no DOM, no UI).
//
//  Extracted verbatim from index.html (Phase 9 modularization).
//  No logic, signatures, or call sites changed.
//
//  Deliberately NOT included in this file (left in the main script,
//  per the Phase 9 dependency audit):
//    - openCustomerPicker(), openGuestHistory() — full-screen modal
//      UI screens, not data-layer functions despite their names.
//    - downloadHotelTemplate() — generates a static sample Excel
//      file (hardcoded example rows); a UI-toolbar convenience for

//    - pkgTemplateFields() — large DOM form-field builder, used

//  as globals exactly as before — the same pattern proven safe

//
//  normalizeHotelRow() is extracted from a different, non-adjacent

//  handler, its only caller) — this does not change its behavior.
//
//  DEF_HOTELS moved here from the main script (its default-seed-data

//  parse-time reference and init()'s fallback continue to work exactly

// ══════════════════════════════════════════════════════════════
var DEF_HOTELS=[
  {id:1,name:'Amara Grand',place:'Goa',cat:'Premium',ph:'+91 832 246 8800',em:'reservations@amaragrand.com',stars:5},
  {id:2,name:'Cidade de Goa',place:'Goa',cat:'Luxury',ph:'+91 832 245 4545',em:'info@cidadedegoa.com',stars:5},
  {id:3,name:'The Leela Palace',place:'Udaipur',cat:'Luxury',ph:'+91 294 670 1234',em:'reservations@theleela.com',stars:5},
  {id:4,name:'Rambagh Palace',place:'Jaipur',cat:'Luxury',ph:'+91 141 221 1919',em:'rambagh@tajhotels.com',stars:5},
  {id:5,name:'Radisson Blu',place:'Shimla',cat:'Standard',ph:'+91 177 665 4444',em:'shimla@radissonblu.com',stars:4},
  {id:6,name:'Wildflower Hall',place:'Shimla',cat:'Luxury',ph:'+91 177 264 8585',em:'wildflower@oberoihotels.com',stars:5},
  {id:7,name:'Ibis Styles',place:'Goa',cat:'Budget',ph:'+91 832 671 2345',em:'goa@ibishotels.com',stars:3},
  {id:8,name:'Alsisar Haveli',place:'Jaipur',cat:'Heritage',ph:'+91 141 236 8290',em:'info@alsisarhaveli.com',stars:4}

// ══════════════════════════════════════════════════════════════
// Load hotels
function loadHotels(){
  if(APP.online){
    return apiFetch('/api/hotels').then(function(r){return r.json();})
      .then(function(list){APP.hotels=list;LS.s('hotels',list);return list;})
      .catch(function(){APP.hotels=LS.g('hotels')||DEF_HOTELS;return APP.hotels;});

function saveHotels(list){
  // Stamp changed/new items with updatedAt and record a tombstone for any
  // hotel that was present before but is missing from `list` now (Remove).
  // Every existing call site (Add/Edit/Remove/Import in bHotels()) is
  // unchanged — they already pass exactly the list they intend to save.
  list=stampAndTombstoneHotels(APP.hotels,list);
  APP.hotels=list; LS.s('hotels',list);
  // Local save always succeeds even fully offline. Mark pending until a
  // sync actually confirms the server has it, exactly like
  // pendingSync/templatesPendingSync above.
  APP.hotelsPendingSync=true;
  if(APP.online){
    // Merge-based sync (never a blind overwrite) — never overwrites a
    // newer copy of a hotel record, and naturally retries on the next
    // backgroundSyncTick() if this attempt fails (e.g. connection drops
    // mid-request).
    doHotelSync(true);
  }
  // If offline, hotelsPendingSync stays true and the change simply waits —
  // init(), backgroundSyncTick() (every 20s) and the on-reconnect network
  // scan all call doHotelSync(true) automatically once APP.online becomes
  // true again, so nothing further needs to happen here for the change to
  // eventually reach the server.
}

// ── ITINERARY TEMPLATE LIBRARY ──────────────────────────────
// Local-only (same as "last used financials") — no server round-trip needed,
// so templates are instantly available offline too. A template is just
// {id, name, days:[...10 day-strings...], createdAt}. Loading a template into
// a booking always makes a fresh copy (array.slice()), so editing the copied
// itinerary inside a booking can never change the saved template, and editing/
// deleting a template later never touches bookings that already copied it.
function loadItinTemplates(){ APP.itinTemplates=LS.g('itinTemplates')||[]; return APP.itinTemplates; }
function saveItinTemplates(list){

  APP.itinTemplates=list; LS.s('itinTemplates',list);
  APP.templatesPendingSync=true;
  setTemplateSyncStatus('pending'); // UI-only
  if(APP.online) doTemplateSync(true);
}
function applyItinTemplateDays(days){
  var out=(days||[]).slice(0,10);
  while(out.length<10)out.push('');
  return out;
}

// ── PACKAGE MASTER (Package Templates) ──────────────────────
// Local-only, exact same pattern as Itinerary Templates above: a package
// template is {id, name, destination, duration, itinerary:[...10 day-strings],
// inclusions:[...], exclusions:[...], terms:[...], remarks:'', paymentPolicy:'',
// createdAt}. "Use" on a booking always makes fresh copies (array.slice() /
// plain string copy) into that booking's own fields — never a shared
// reference — so editing the booking afterwards can never change the saved
// package template, and editing/deleting a template later never touches any
// booking that already copied it. This module only touches booking fields
// (destination, itinerary, inclusions, exclusions, terms, remarks,
// paymentPolicy) — it never reads or writes costing, quotation, invoice,
// voucher, receipt or hotel/sync logic.
function loadPkgTemplates(){ APP.pkgTemplates=LS.g('pkgTemplates')||[]; return APP.pkgTemplates; }
function savePkgTemplates(list){
  list=stampAndTombstoneTemplates('pkgTemplates',APP.pkgTemplates,list);
  APP.pkgTemplates=list; LS.s('pkgTemplates',list);
  APP.templatesPendingSync=true;
  setTemplateSyncStatus('pending'); // UI-only
  if(APP.online) doTemplateSync(true);
}
function linesToArr(text){ return (text||'').split('\n').map(function(s){return s.trim();}).filter(Boolean); }
function arrToLines(arr){ return (arr||[]).join('\n'); }
function newPkgTemplate(){
  return{id:Date.now()+Math.random(),name:'',destination:'',duration:'',
    itinerary:applyItinTemplateDays([]),inclusions:[],exclusions:[],terms:[],
    remarks:'',paymentPolicy:'',createdAt:now()};
}

// ── EXCEL IMPORT HELPERS ─────────────────────────────────────
// Accepts flexible column headers (any case, any order) and maps
// them to the hotel record fields used throughout the app.
function normalizeHotelRow(row){
  var out={name:'',place:'',cat:'',ph:'',em:'',stars:3};
  Object.keys(row).forEach(function(key){
    var k=key.toLowerCase().trim();
    var v=String(row[key]||'').trim();
    if(!v)return;
    if(k.indexOf('name')>=0) out.name=v;
    else if(k.indexOf('place')>=0||k.indexOf('city')>=0||k.indexOf('location')>=0||k.indexOf('destination')>=0) out.place=v;
    else if(k.indexOf('cat')>=0||k.indexOf('type')>=0) out.cat=v;
    else if(k.indexOf('phone')>=0||k.indexOf('contact')>=0||k.indexOf('mobile')>=0||k==='ph') out.ph=v;
    else if(k.indexOf('mail')>=0) out.em=v;
    else if(k.indexOf('star')>=0||k.indexOf('rating')>=0) out.stars=parseInt(v)||3;
  });
  return out;
}

<script>
// ══════════════════════════════════════════════════════════════
//  V2.1 FEATURE #1 — HOTEL RATE MASTER (Hotel Master Import with Rates)
//
//  Brand-new module. Does NOT modify, call into (as a callee), or change
//  the behavior of any existing RC1 function. calcOpt() is untouched.
//  Existing Hotel Master (hotel-template-data.js: loadHotels/saveHotels/
//  normalizeHotelRow) is untouched and unaffected.
//
//  Scope for this phase (explicitly approved):
//    - LOCAL/OFFLINE-ONLY. No sync, no tombstones, no backend calls.
//      Persisted the same simple way Package/Itinerary Templates were
//      before their own sync existed: APP.hotelRates + LS('hotelRates').
//    - Duplicate key: hotelName + city + roomCategory + mealPlan
//      (case-insensitive, trimmed).
//    - Import modes (exact semantics approved):
//        "add"    — match exists -> skip (no duplicate created).
//                    no match -> add.
//        "update" — match exists -> update its rate fields.
//                    no match -> add (upsert).
//        "skip"   — match exists -> skip.
//                    no match -> add.
//    - Auto-fill target fields on a booking's hotel row map 1:1 onto
//      fields calcOpt() already reads — no calculation-engine changes:
//        roomRate      -> ratePerRoom
//        extraAdult    -> extraAdultRate
//        extraChildWB  -> childRate        (Child WITH bed)
//        extraChildNB  -> childNoBedRate   (Child WithOUT bed)
//        extraMattress -> mattressRate     (NOTE: mattressRate exists in
//                          emH()'s shape but is not read by calcOpt() or
//                          rendered in any UI in RC1 — see calcOpt()'s own
//                          "Bug fix (1): Mattress Rate field removed"
//                          comment. Stored here for data completeness;
//                          auto-filling it has no visible/functional effect
//                          in RC1, and this file does not change that.)
// ══════════════════════════════════════════════════════════════

// ── DATA LAYER (local-only, no sync) ─────────────────────────
function loadHotelRates(){ APP.hotelRates=LS.g('hotelRates')||[]; return APP.hotelRates; }
function saveHotelRates(list){ APP.hotelRates=list; LS.s('hotelRates',list); }

// ── DUPLICATE KEY ─────────────────────────────────────────────
function hotelRateKey(r){
  return (r.hotelName||'').trim().toLowerCase()+'|'+(r.city||'').trim().toLowerCase()+'|'+
         (r.roomCategory||'').trim().toLowerCase()+'|'+(r.mealPlan||'').trim().toLowerCase();
}

// ── EXCEL IMPORT: flexible-header column mapping ─────────────
// Mirrors the style of normalizeHotelRow() in hotel-template-data.js
// (any case, any order, extra columns ignored) but is a separate function
// — normalizeHotelRow() itself is not touched.
function normalizeHotelRateRow(row){
  var out={hotelName:'',city:'',category:'',roomCategory:'',mealPlan:'',
    roomRate:0,extraAdult:0,extraChildWB:0,extraChildNB:0,extraMattress:0,remarks:''};
  Object.keys(row).forEach(function(key){
    var k=key.toLowerCase().trim();
    var v=String(row[key]==null?'':row[key]).trim();
    if(!v)return;
    if(k.indexOf('room')>=0 && k.indexOf('cat')>=0) out.roomCategory=v;
    else if(k.indexOf('hotel')>=0 || k==='name') out.hotelName=v;
    else if(k.indexOf('city')>=0||k.indexOf('place')>=0||k.indexOf('location')>=0) out.city=v;
    else if(k.indexOf('meal')>=0) out.mealPlan=v.toUpperCase();
    else if(k.indexOf('cat')>=0||k.indexOf('type')>=0) out.category=v;
    else if((k.indexOf('room')>=0&&k.indexOf('rate')>=0)||k==='rate'||k==='baserate') out.roomRate=parseFloat(v)||0;
    else if(k.indexOf('extra')>=0&&k.indexOf('adult')>=0) out.extraAdult=parseFloat(v)||0;
    else if(k.indexOf('without')>=0&&k.indexOf('bed')>=0) out.extraChildNB=parseFloat(v)||0;
    else if(k.indexOf('no')>=0&&k.indexOf('bed')>=0) out.extraChildNB=parseFloat(v)||0;
    else if(k.indexOf('with')>=0&&k.indexOf('bed')>=0) out.extraChildWB=parseFloat(v)||0;
    else if(k.indexOf('mattress')>=0) out.extraMattress=parseFloat(v)||0;
    else if(k.indexOf('remark')>=0||k.indexOf('note')>=0) out.remarks=v;
  });
  return out;
}

// ── RATE LOOKUP (used by the booking-form auto-fill hook in index_dev.html) ──
function findMatchingRate(hotelName, city, roomCategory, mealPlan){
  var hn=(hotelName||'').trim().toLowerCase();
  var rc=(roomCategory||'').trim().toLowerCase();
  var mp=(mealPlan||'').trim().toLowerCase();
  if(!hn||!rc||!mp) return null;
  var ct=(city||'').trim().toLowerCase();
  var list=APP.hotelRates||[];
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if((r.hotelName||'').trim().toLowerCase()===hn &&
       (r.city||'').trim().toLowerCase()===ct &&
       (r.roomCategory||'').trim().toLowerCase()===rc &&
       (r.mealPlan||'').trim().toLowerCase()===mp){
      return r;
    }
  }
  return null;
}

// Pure function: given a booking's hotel row object, returns a plain
// {field:value} patch of ONLY the fields that are currently 0/blank and
// have a matching rate to fill from — or null if no match / nothing to
// fill. No DOM, no mutation — the caller (index_dev.html) decides how to
// apply it. This is what makes "never overwrite a manually-typed value"
// safe and easy to unit-test in isolation.
function computeHotelRateAutoFillPatch(h){
  var match=findMatchingRate(h.hotelName, h.place, h.roomCat, h.mealPlan);
  if(!match) return null;
  var patch={};
  if(!h.ratePerRoom) patch.ratePerRoom=match.roomRate;
  if(!h.extraAdultRate) patch.extraAdultRate=match.extraAdult;
  if(!h.childRate) patch.childRate=match.extraChildWB;
  if(!h.childNoBedRate) patch.childNoBedRate=match.extraChildNB;
  if(!h.mattressRate) patch.mattressRate=match.extraMattress;
  return Object.keys(patch).length?patch:null;
}

function makeHotelRateRecord(row, existingRecord){
  return {
    id: existingRecord?existingRecord.id:(Date.now()+Math.random()),
    hotelName:row.hotelName, city:row.city, category:row.category,
    roomCategory:row.roomCategory, mealPlan:row.mealPlan,
    roomRate:row.roomRate, extraAdult:row.extraAdult,
    extraChildWB:row.extraChildWB, extraChildNB:row.extraChildNB,
    extraMattress:row.extraMattress, remarks:row.remarks,
    createdAt: existingRecord?existingRecord.createdAt:now(),
    updatedAt: now()
  };
}

// ── IMPORT: applies the 3 approved modes, returns the summary counts ──
// parsedRows must already be normalizeHotelRateRow() output with a
// non-empty hotelName/roomCategory/mealPlan (the caller filters out
// incomplete rows and counts them as "failed" before calling this).
function importHotelRates(parsedRows, mode){
  var merged=(APP.hotelRates||[]).slice();
  var added=0, updated=0, skipped=0;
  var directoryTouched=false;
  var dirMerged=(APP.hotels||[]).slice();

  parsedRows.forEach(function(row){
    var rowKey=hotelRateKey(row);
    var idx=merged.findIndex(function(x){return hotelRateKey(x)===rowKey;});
    var exists=idx>=0;

    if(mode==='add'){
      if(exists){ skipped++; }
      else { merged.push(makeHotelRateRecord(row)); added++; }
    } else if(mode==='update'){
      if(exists){ merged[idx]=makeHotelRateRecord(row, merged[idx]); updated++; }
      else { merged.push(makeHotelRateRecord(row)); added++; }
    } else { // 'skip'
      if(exists){ skipped++; }
      else { merged.push(makeHotelRateRecord(row)); added++; }
    }

    // Ensure a Hotel Master directory entry exists too, via the EXACT SAME
    // Name+Place match rule bHotels()'s existing Excel import already uses
    // (see index_dev.html) — only ADDS a directory entry when genuinely
    // missing; an existing directory entry's phone/email/stars/category are
    // never touched by this import.
    if(row.hotelName){
      var dIdx=dirMerged.findIndex(function(x){return x.name.toLowerCase()===row.hotelName.toLowerCase() && (x.place||'').toLowerCase()===(row.city||'').toLowerCase();});
      if(dIdx<0){
        dirMerged.push({id:Date.now()+Math.random(), name:row.hotelName, place:row.city||'', cat:row.category||'Standard', ph:'', em:'', stars:3});
        directoryTouched=true;
      }
    }
  });

  saveHotelRates(merged);
  if(directoryTouched) saveHotels(dirMerged); // saveHotels() itself is completely untouched/unmodified

  return {total:parsedRows.length, added:added, updated:updated, skipped:skipped};
}

// ══════════════════════════════════════════════════════════════
//  V2.1 FEATURE #1b — HOTEL RATE MASTER: MANUAL ADD / EDIT / DELETE
//
//  Purely additive data-layer functions for the secondary (manual) entry
//  path. Does NOT change importHotelRates(), normalizeHotelRateRow(),
//  findMatchingRate(), computeHotelRateAutoFillPatch(), hotelRateKey(),
//  makeHotelRateRecord(), loadHotelRates(), or saveHotelRates() above —
//  every one of those is reused as-is, not modified.
//
//  Same storage (APP.hotelRates + LS('hotelRates')), same dedupe key,
//  same record shape (makeHotelRateRecord), so manual entries are
//  indistinguishable from imported ones to findMatchingRate()/calcOpt().
// ══════════════════════════════════════════════════════════════

// Finds an existing rate matching the given field values by the same
// key rule as import (hotelName+city+roomCategory+mealPlan, case-insensitive).
// excludeId lets an in-progress edit ignore its own record when checking
// whether it now collides with a *different* existing record.
function findHotelRateMatchByFields(fields, excludeId){
  var key=hotelRateKey(fields);
  var list=APP.hotelRates||[];
  for(var i=0;i<list.length;i++){
    if(excludeId!=null && list[i].id===excludeId) continue;
    if(hotelRateKey(list[i])===key) return list[i];
  }
  return null;
}

// Manual "Add New Rate". Caller has already resolved what to do about a
// duplicate (see UI stage): mode 'duplicate' always inserts a new record;
// mode 'update' (or omitted, with no existing match) upserts into the
// matching record if one exists, otherwise adds new. Mirrors the exact
// same add/update semantics importHotelRates() already uses — just for
// a single manual row instead of a parsed sheet.
function addHotelRateManual(fields, mode){
  var list=(APP.hotelRates||[]).slice();
  var existing=(mode==='duplicate')?null:findHotelRateMatchByFields(fields,null);
  if(existing){
    var idx=list.findIndex(function(x){return x.id===existing.id;});
    list[idx]=makeHotelRateRecord(fields, existing);
    saveHotelRates(list);
    return {action:'updated', record:list[idx]};
  }
  var rec=makeHotelRateRecord(fields);
  list.push(rec);
  saveHotelRates(list);
  return {action:'added', record:rec};
}

// Manual "Edit Existing Rate". id identifies the record being edited;
// fields is the full new field set. Always writes to that exact record
// (by id) — it never merges into a different record, even if the edited
// key fields now match another existing rate (the UI surfaces that as a
// warning before calling this, per the approved plan, but the data layer
// itself stays a straightforward single-record update so two records
// with the same effective key can never silently swallow each other).
function updateHotelRateManual(id, fields){
  var list=(APP.hotelRates||[]).slice();
  var idx=list.findIndex(function(x){return x.id===id;});
  if(idx<0) return null;
  list[idx]=makeHotelRateRecord(fields, list[idx]);
  saveHotelRates(list);
  return list[idx];
}

// Manual "Delete Rate". Simple named wrapper (kept as its own function so
// it's independently callable/testable). The confirmation step lives
// entirely in the UI layer, per approved plan — this function itself
// performs no confirmation.
function deleteHotelRateManual(id){
  saveHotelRates((APP.hotelRates||[]).filter(function(x){return x.id!==id;}));
}

// 3-option confirmation dialog, purely additive alongside the existing
// 2-option confirmDialog() (which is NOT modified). Needed here because
// a duplicate manual rate has three distinct outcomes, not two:
// Update Existing / Create Duplicate / Cancel. Same visual style/overlay
// pattern as confirmDialog() for consistency. "Update Existing" is the
// default/primary action per approved plan (styled 'bg', listed first).
function hotelRateDuplicateDialog(message,onUpdate,onDuplicate){
  var overlay=el('div');
  overlay.style.cssText='position:fixed;inset:0;background:#000000aa;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px';

  var iconEl=el('div');iconEl.style.cssText='font-size:30px;margin-bottom:8px';iconEl.textContent='⚠️';
  var msgEl=el('div');msgEl.style.cssText='font-size:14px;color:#E8E0D0;margin-bottom:18px;line-height:1.5';msgEl.textContent=message;
  box.appendChild(iconEl);box.appendChild(msgEl);
  var col=el('div');col.style.cssText='display:flex;flex-direction:column;gap:8px';
  function close(){if(overlay.parentNode)document.body.removeChild(overlay);}
  var updateBtn=btn('✅ Update Existing','btn bg sm',function(){close();onUpdate();});
  var dupBtn=btn('➕ Create Duplicate','btn bm sm',function(){close();onDuplicate();});
  var cancelBtn=btn('Cancel','btn sm or',close);
  col.appendChild(updateBtn);col.appendChild(dupBtn);col.appendChild(cancelBtn);
  box.appendChild(col);overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// ══════════════════════════════════════════════════════════════
//  BOOKING DATA MODEL — blank-record factories (emH/emV), hotel/

// ── BLANK TEMPLATES ─────────────────────────────────────────
function emH(){return{place:'',hotelName:'',roomCat:'',checkIn:'',checkOut:'',checkInTime:'14:00',checkOutTime:'12:00',confirmNo:'',address:'',phone:'',rooms:1,mealPlan:'CP',ratePerRoom:0,extraMattress:0,mattressRate:0,extraAdults:0,extraAdultRate:0,chargeableChild:0,childRate:0,childNoBed:0,childNoBedRate:0};}
function emV(){return{type:'',vehicleNo:'',from:'',to:'',cost:0};}
function isBlankHotel(h){return h && !h.hotelName && !h.place && !(parseFloat(h.ratePerRoom)>0);}
function isBlankVehicle(v){return v && !v.type && !v.vehicleNo && !(parseFloat(v.cost)>0);}
// Trims trailing empty hotel rows (kept in sync across opt1/2/3 by index) so an old
// booking that still has 8 pre-created blank slots doesn't render 24 empty rows —
// always leaves at least 1 row per option.
function trimHotelRows(b){
  // Only trim once per edit session — otherwise a row the agent just added via
  // "+ Add Hotel" (still blank until they type into it) would get collapsed away
  // again the next time this tab/panel re-renders.
  if(b._hotelsTrimmed)return;
  b._hotelsTrimmed=true;
  // Bootstrap: make sure the legacy opt1/opt2/opt3 arrays exist and are
  // non-empty BEFORE asking getOptFields() for them — getOptFields()'s
  // fallback for a missing/empty field returns a fresh throwaway [] rather
  // than something stored on b (untouched Phase 1 behavior, not changed
  // here), so this line is still needed as-is.
  ['opt1','opt2','opt3'].forEach(function(k){if(!b[k]||!b[k].length)b[k]=[emH()];});
  // PHASE 2: read/trim through getOptFields() so this acts on whichever
  // revision is active. Every edit below is in-place (length truncation,
  // push) rather than a reassignment, so it lands on the exact array object
  // getOptFields() returned — the legacy b['opt'+n] array for every booking
  // today (zero behavior change), or an active revision's own hotels array
  // once Phase 3 revisions exist.
  var arrs=[1,2,3].map(function(n){return getOptFields(b,n).hotels;});
  var last=-1;
  for(var i=0;i<Math.max(arrs[0].length,arrs[1].length,arrs[2].length);i++){
    var blank=isBlankHotel(arrs[0][i])&&isBlankHotel(arrs[1][i])&&isBlankHotel(arrs[2][i]);
    if(!blank)last=i;
  }
  var keep=Math.max(1,last+1);
  arrs.forEach(function(arr){arr.length=Math.min(arr.length,keep);while(arr.length<keep)arr.push(emH());});
  // PHASE 2: if a revision is active, re-mirror its (now-trimmed) full state
  // into the legacy opt1/opt2/opt3 fields — reuses activateRevision()
  // (Phase 3A) rather than duplicating its copy logic here. No-op today
  // (no booking has revisions yet at the point trimHotelRows first runs).
  var rev0=getActiveRevisionForRead(b);
  if(rev0) activateRevision(b, rev0.revNo);
}
function trimVehicleRows(b){
  if(b._vehTrimmed)return;
  b._vehTrimmed=true;
  if(!b.vehicles||!b.vehicles.length){b.vehicles=[emV()];return;}
  var last=-1;
  b.vehicles.forEach(function(v,i){if(!isBlankVehicle(v))last=i;});
  b.vehicles=b.vehicles.slice(0,Math.max(1,last+1));
}
function addHotelRow(b){
  // PHASE 2: hotel arrays now come from getOptFields() so a new row is added
  // to whichever revision is active, not always the legacy opt1/opt2/opt3.
  // For every booking today (no b.revisions yet) getOptFields(b,1).hotels IS
  // the same b.opt1 array reference as before — zero behavior change.
  var arr1=getOptFields(b,1).hotels;
  var last1=arr1[arr1.length-1]||{};
  // Smart defaults: new row inherits place/dates/room-qty pattern from the previous
  // hotel so multi-city itineraries don't need the same numbers typed again — the
  // agent only edits what's actually different (usually just the city + hotel name).
  var nh=emH();
  nh.rooms=last1.rooms||b.rooms||1;
  nh.extraAdults=last1.extraAdults||0;
  nh.extraMattress=last1.extraMattress||0;
  nh.chargeableChild=last1.chargeableChild||0;
  nh.childNoBed=last1.childNoBed||0;
  nh.mealPlan=last1.mealPlan||'CP';
  if(last1.checkOut){nh.checkIn=last1.checkOut;var d=new Date(last1.checkOut);if(!isNaN(d)){d.setDate(d.getDate()+1);nh.checkOut=d.toISOString().slice(0,10);}}
  [1,2,3].forEach(function(n){var arr=getOptFields(b,n).hotels;var row=(n===1)?nh:JSON.parse(JSON.stringify(nh));if(n!==1){row.hotelName='';row.roomCat='';row.ratePerRoom=0;row.extraAdultRate=0;row.childRate=0;row.childNoBedRate=0;}arr.push(row);});
  // PHASE 2: if a revision is active, re-mirror its (now-extended) full
  // state into the legacy opt1/opt2/opt3 fields (reuses activateRevision(),
  // Phase 3A) — otherwise the brand-new row would only exist on the
  // revision's own array, and setHotelField()'s per-field mirror couldn't
  // reach it (legacyArr[hidx] wouldn't exist yet) until this ran.
  var rev1=getActiveRevisionForRead(b);
  if(rev1) activateRevision(b, rev1.revNo);
}
function removeHotelRow(b,idx){
  // PHASE 2: same routing as addHotelRow() — acts on the active revision's
  // hotel arrays via getOptFields(), or legacy opt1/opt2/opt3 when no
  // revisions exist (identical behavior to before).
  [1,2,3].forEach(function(n){var arr=getOptFields(b,n).hotels;if(arr&&arr.length>1)arr.splice(idx,1);});
  var rev2=getActiveRevisionForRead(b);
  if(rev2) activateRevision(b, rev2.revNo);
}
function addVehicleRow(b){b.vehicles.push(emV());}
function removeVehicleRow(b,idx){if(b.vehicles.length>1)b.vehicles.splice(idx,1);}

// ── QUOTATION NUMBERING (MH-<PlainSequence>, no year embedded) ────────────
// The full numeric part after "MH-" is treated as one plain integer counter
// that just increments by 1 every time (…MH-100826 -> MH-100827 -> … ->
// MH-100899 -> MH-100900, carrying digits exactly like normal addition —
// no special handling needed since JS integer math already does this).
// The counter is derived fresh each time as the MAX of (a) the LS-stored
// counter and (b) the highest MH-<digits> quotNo already present in
// APP.bookings — so this is self-correcting: even if an old stored counter
// is stale or in a different format, real booking data always wins and the
// sequence stays in sync with what's actually been used.
// Manual edits are handled separately by onManualQuotNoChange (see the
// Quotation No. field in buildTab) so this module never reads the DOM.
function getQuotSeq(){ var s=LS.g('quotSeq'); return (typeof s==='number'&&isFinite(s)&&s>=1000)?s:1000; }
function setQuotSeq(n){ if(typeof n==='number'&&isFinite(n))LS.s('quotSeq',n); }
// Recognizes the "MH-<digits>" shape (any number of digits — no year split).
// Returns null for anything else (e.g. a custom prefix like "VIP-001"), which
// callers must treat as "leave the auto sequence alone".
function parseSmartQuotNo(v){
  if(!v)return null;
  var m=/^MH-(\d+)$/.exec(String(v).trim());
  if(!m)return null;
  var num=parseInt(m[1],10);
  if(isNaN(num))return null;
  return{seq:num};
}
// Bug fix: a random quotNo can collide with an existing booking's quotNo. Since saveBooking()
// matches records by quotNo, a collision would silently overwrite a different guest's booking
// instead of creating a new one — which looks like "my save didn't work". Keep generating
// until we get a number not already used by an existing booking (only relevant if a manual
// entry elsewhere ever lands exactly on an upcoming auto number).
function genQuotNo(){
  var existing={};(APP.bookings||[]).forEach(function(b){if(b&&b.quotNo)existing[b.quotNo]=true;});
  var maxFromBookings=0;
  (APP.bookings||[]).forEach(function(b){
    var p=parseSmartQuotNo(b&&b.quotNo);
    if(p && p.seq>maxFromBookings) maxFromBookings=p.seq;
  });
  var seq=Math.max(getQuotSeq(), maxFromBookings);
  var qn;
  do{ seq++; qn='MH-'+seq; }while(existing[qn]);
  setQuotSeq(seq);
  return qn;
}
// Called when the user manually edits the Quotation No. field (on blur). If it
// matches the "MH-<digits>" shape, that number becomes the new counter
// baseline, so the *next* auto-generated number continues right after it
// (e.g. typing "MH-150000" means the next auto number is "MH-150001"). Any
// other format (custom prefix, free text) is saved as-is elsewhere and must
// NOT reach this far affecting the sequence — callers only invoke this when
// parseSmartQuotNo() already matched.
function onManualQuotNoChange(v){
  var parsed=parseSmartQuotNo(v);
  if(parsed)setQuotSeq(parsed.seq);
}
// Speed optimization: pre-fill GST / Markup Mode / Percentage Markup / Fixed
// Markup / Misc-Other Charges on a brand-new booking with whatever values were
// last used (last saved), instead of always starting from 0. Saves re-typing
// the same GST%/markup% on every new quotation for agents who mostly reuse the
// same commercial terms. Purely a default — no calculation, quotation, voucher,
// invoice or receipt logic is touched, and the user can still change any of
// these fields freely on the new booking (see saveBooking() for where the
// "last used" snapshot is captured, which is only on an explicit Save).
function lastFin(){
  var d=LS.g('lastFinancials');
  return{mkPct:(d&&d.mkPct)||0,mkFixed:(d&&d.mkFixed)||0,misc:(d&&d.misc)||0,gstPct:(d&&d.gstPct)||0};
}
function newBk(){
  var lf=lastFin();

  // brand-new booking — never inherited from the last-saved booking's
  // values. Previously both were pre-filled from lf.mkPct/lf.mkFixed (the
  // "remember last used" speed optimization below), which is how a stray
  // saved value (e.g. 3200) kept reappearing as the default Fixed Markup on
  // every new booking. GST% and Misc/Other Charges are intentionally left
  // as-is (still pre-filled from lf.misc/lf.gstPct) — that behavior was not
  // reported as a bug and is unchanged. This only affects newBk(), used
  // solely for the "+ New Booking" button; loading/editing an existing
  // booking never calls this function, so previously saved bookings keep
  // showing their own saved mkPct/mkFixed values exactly as before.
  return{
    quotNo:genQuotNo(),
    guestName:'',contact:'',email:'',destination:'',
    adults:2,children:0,compChildren:0,rooms:1,
    opt1:[emH()],opt2:[emH()],opt3:[emH()],
    vehicles:[emV()],vehicleRemarks:'',
    mkPct1:0,mkFixed1:0,misc1:lf.misc,gstPct1:lf.gstPct,childVehPct1:0,
    mkPct2:0,mkFixed2:0,misc2:lf.misc,gstPct2:lf.gstPct,childVehPct2:0,
    mkPct3:0,mkFixed3:0,misc3:lf.misc,gstPct3:lf.gstPct,childVehPct3:0,
    selectedOption:1,bookingRef:'',bookingDate:'',startDate:'',endDate:'',
    driverName:'',driverContact:'',hotelConfirmNo:'',
    itinerary:['','','','','','','','','',''],
    inclusions:['Hotel accommodation as per selected option','Vehicle as per itinerary with driver bata','Meal plan as per hotel (CP/MAP/AP)','Toll, parking and driver allowance','All airport and railway station transfers','Sightseeing as per itinerary','Children below 5 yrs: Complimentary (no bed)'],
    exclusions:['Air / train / bus ticket fare','Entry fees and monument tickets','Personal expenses and laundry','Travel and medical insurance','Tips to driver and hotel staff','Adventure activities and permits','Anything not mentioned in inclusions'],
    // Package Master fields: filled in only when the user picks a package
    // template on the Package tab (fresh copies — see openPkgPicker() below),
    // otherwise left blank/empty. Purely additive storage; not read by any
    // costing/quotation/voucher/invoice/receipt logic.
    terms:[],remarks:'',paymentPolicy:'',packageTemplateId:null,packageTemplateName:'',
    status:'New Inquiry',paymentReceived:0,notes:'',
    // Phase 1A/1B: Lead management fields
    priority:'Medium',followUpDate:'',followUpNotes:'',lostReason:'',lostReasonOther:'',
    // Feature (6): manual invoice line items — empty array means "use auto-calculated
    // Tour Package rows"; once the user edits anything here it overrides those rows.
    invoiceItems:[],
    // Feature (7): payment receipt fields
    paymentMode:'Cash',receivedBy:'',paymentDate:'',receiptNo:'',
    // Installment Payment History — Phase 1 (foundation only): an empty array
    // means "no installments recorded yet — fall back to the existing single
    // paymentReceived field" (see getPaymentSummary() below), the exact same
    // additive/backward-compatible pattern already used by invoiceItems above.
    // Nothing reads or writes this array yet outside getPaymentSummary() itself;
    // Confirm tab UI, Invoice, Receipt, Analytics and Sync are all untouched.
    paymentHistory:[],
    // Supplier Payment Ledger — additive-only: an empty array here means "no
    // suppliers recorded yet". Completely separate from paymentHistory
    // (Guest Payment) above — see normalizeBooking() and
    // getSupplierPaymentSummary() for the read/self-heal logic.
    supplierPayments:[],
    createdAt:now(),updatedAt:now()
  };
}

// Phase 8 modularization: SAVED_IP, SERVER_CANDIDATES, buildCandidates(),
// tryUrl(), checkServer(), getLocalIP(), scanRange(), and scanNetwork()
// now live in js/sync.js, loaded before this script. No logic changed —
// see js/sync.js for the extracted code.

// Documents modularization: nts() now lives in js/documents.js
// (majority consumer — 8 of 12 real call sites), loaded before this
// script. No logic changed — see js/documents.js for the extracted code.
// ── SMART HOTEL DATE SHIFT ──────────────────────────────────
// Read-only helpers used only by the Tour Start Date field (Guest/Confirm tabs)
// to detect how far the date moved and to shift every hotel's Check-in/Check-out
// by that same number of days. Pure date math only — no costing, no calcOpt,
// no pricing logic touched here.
// dayDiff: signed day count from oldIso -> newIso (positive = moved later,
// negative = moved earlier). Uses the same "new Date(iso)" parsing nts() already
// relies on elsewhere, so behavior stays consistent across month-end/year-end/
// leap-year boundaries (native Date/UTC math handles all of those correctly).
function dayDiff(oldIso,newIso){
  if(!oldIso||!newIso)return 0;
  var d=(new Date(newIso)-new Date(oldIso))/86400000;
  return Math.round(d);
}
// shiftIsoDate: returns a new 'YYYY-MM-DD' string moved by offsetDays (+/-).
// Uses setUTCDate (not local setDate) so the shift is correct regardless of the
// browser's local timezone, since 'YYYY-MM-DD' strings are parsed as UTC midnight.
function shiftIsoDate(iso,offsetDays){
  if(!iso||!offsetDays)return iso;
  var d=new Date(iso);
  if(isNaN(d.getTime()))return iso;
  d.setUTCDate(d.getUTCDate()+offsetDays);
  return d.toISOString().slice(0,10);
}
// shiftAllHotelDates: shifts Check-in/Check-out on every hotel row across all
// three options (opt1/opt2/opt3), regardless of which option is currently
// selected/displayed. Only touches h.checkIn/h.checkOut — every other hotel
// field (rates, rooms, meal plan, confirmation no., etc.) is left untouched,
// and fields stay exactly as editable as before since this only rewrites the
// stored value, not the input wiring.
function shiftAllHotelDates(b,offsetDays){
  if(!offsetDays)return;
  ['opt1','opt2','opt3'].forEach(function(k){
    (b[k]||[]).forEach(function(h){
      if(h.checkIn)h.checkIn=shiftIsoDate(h.checkIn,offsetDays);
      if(h.checkOut)h.checkOut=shiftIsoDate(h.checkOut,offsetDays);
    });
  });
}
// wireTourStartShift: attaches the "did Tour Start Date actually change" watcher
// to a Tour Start Date field's wrapper element. Deliberately keyed off 'focusout'
// (fires once when the user leaves the field) rather than the field's own
// live 'input' event — dateInp()'s text side can call its setter more than once
// while a date is still being typed (e.g. a 2-digit-year partial match before the
// 4-digit year is finished), and we only want to prompt once per real edit, with
// the final committed value. This only ever runs for the Tour Start Date field —
// Hotel Check-in/Check-out fields on the Hotels tab are never wired to this, so
// editing hotel dates directly never triggers this dialog.
function wireTourStartShift(wrapEl,b,tab,frag){
  var baseline=b.startDate;
  wrapEl.addEventListener('focusout',function(){
    setTimeout(function(){
      var newV=b.startDate;
      if(baseline&&newV&&baseline!==newV){
        var offset=dayDiff(baseline,newV);
        if(offset!==0){
          confirmDialog(
            'Tour dates have changed. Do you want to automatically update all Hotel Check-in/Check-out dates?',
            function(){
              shiftAllHotelDates(b,offset);
              toast('Hotel Check-in/Check-out dates shifted by '+(offset>0?'+':'')+offset+' day(s)',true);
              // Re-render the current tab only (same self-refresh pattern already
              // used elsewhere in buildTab, e.g. Add/Remove Vehicle) so the Tour
              // dates shown here stay in sync; the Hotels tab picks up the shifted
              // dates live from b.opt1/opt2/opt3 the next time it's opened.
              var tc=frag.parentNode;if(tc){tc.innerHTML='';tc.appendChild(buildTab(tab));}
            },
            'Shift Dates','Cancel'
          );
        }
      }
      baseline=newV;
    },0);
  });
}

function fmt(n){return '\u20b9'+Math.round(n||0).toLocaleString('en-IN');}

// ────────────────────────────────────────────────────────────────────────
// Mobile Sticky Cost Summary — DISPLAY ONLY. Takes an already-computed
// calcOpt() result object (the exact same object refreshSummary() already
// builds on every costing edit) and writes 4 numbers into the sticky bar.
// It does not call calcOpt() itself and does not touch hotelCost, vehCost,
// markupAmt, gstAmt, or grandTotal — those are 100% owned by calcOpt().
// The only arithmetic here is a plain percentage READOUT (markup as a % of
// base cost) purely for display, using the two totals calcOpt() already
// returns — no new rate, cost, or business rule is introduced.
// ────────────────────────────────────────────────────────────────────────
// Smart Colour Coding (mobile-only element — #stickyCostBar is display:none
// on desktop regardless of the .show class, so setting these colors directly
// never touches the desktop UI). Every value below is read straight off the
// calcOpt() result object passed in — nothing here recomputes cost, price,
// profit or margin.
function updateStickyCostBar(c){
  if(!c) return;
  var costEl=document.getElementById('scbCost'),sellEl=document.getElementById('scbSell'),
      profitEl=document.getElementById('scbProfit'),pctEl=document.getElementById('scbProfitPct');
  if(!costEl||!sellEl||!profitEl||!pctEl) return; // sticky bar not in DOM (e.g. desktop-only code path never renders it)
  var totalCost=c.base;          // same figure already shown as "Base Total" in the full Cost Summary
  var sellingPrice=c.grandTotal; // same figure already shown as "GRAND TOTAL" in the full Cost Summary
  var profit=c.markupAmt;        // same figure already shown as "+ Markup / Service" in the full Cost Summary
  var profitPct=totalCost>0?(profit/totalCost*100):0;
  costEl.textContent=fmt(totalCost);
  sellEl.textContent=fmt(sellingPrice);
  profitEl.textContent=fmt(profit);
  pctEl.textContent=profitPct.toFixed(1)+'%';
  // Total Cost → Dark Gray
  costEl.style.color='#8A8B93';
  // Selling Price → Blue
  sellEl.style.color='#3498DB';
  // Profit Amount → Green>0 / Red<0 / Gray=0
  profitEl.style.color = profit>0 ? '#2ECC71' : (profit<0 ? '#E74C3C' : '#8A8B93');
  // Profit % → Green ≥30% / Orange 15–29.99% / Red <15%
  pctEl.style.color = profitPct>=30 ? '#2ECC71' : (profitPct>=15 ? '#E67E22' : '#E74C3C');
}

// Mobile Sticky Option Switching Toolbar tap handler. If the Hotels tab is

// b._activeOpt, redraws the option panel, and refreshes the Cost Summary).

  var searchInput=document.createElement('input');

  var listWrap=document.createElement('div');listWrap.style.cssText='flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px';

  // Build unique customer list: latest booking per guestName wins (most
  // recent contact/email), sorted by most recently updated first.
  var byName={};
  (APP.bookings||[]).forEach(function(bb){
    if(!bb.guestName)return;
    var key=bb.guestName.trim().toLowerCase();
    if(!key)return;
    var existing=byName[key];
    if(!existing||new Date(bb.updatedAt||bb.createdAt||0)>new Date(existing.updatedAt||existing.createdAt||0)){
      byName[key]=bb;

  var customers=Object.values(byName).sort(function(a,bb){return new Date(bb.updatedAt||bb.createdAt||0)-new Date(a.updatedAt||a.createdAt||0);});

  function render(filterText){
    listWrap.innerHTML='';

      return !q||(c.guestName||'').toLowerCase().indexOf(q)>=0||(c.contact||'').toLowerCase().indexOf(q)>=0;
    });

        +'<div style="font-size:11px;color:#8A8090;margin-top:3px">'+(c.contact||'—')+(c.email?' &bull; '+c.email:'')+'</div>'
        +'<div style="font-size:11px;color:#D4A843;margin-top:3px">કુલ '+custBookings.length+' booking'+(custBookings.length>1?'s':'')+'</div>';
      info.addEventListener('click',function(){
        onPick({guestName:c.guestName,contact:c.contact,email:c.email});
        modal.remove();
        toast('✅ '+c.guestName+' ની details fill થઈ ગઈ');
      });
      var histBtn=btn('📋 History','btn bm sm',function(){openGuestHistory(c.guestName);});
      histBtn.style.cssText='flex-shrink:0';
      row.appendChild(info);row.appendChild(histBtn);
      card.appendChild(row);
      listWrap.appendChild(card);
    });
  }
  render('');
  searchInput.addEventListener('input',function(){render(searchInput.value);});

  var closeBtn=document.createElement('button');
  closeBtn.className='btn bm';closeBtn.textContent='બંધ કરો';
  closeBtn.addEventListener('click',function(){modal.remove();});

  modal.appendChild(title);modal.appendChild(hint);modal.appendChild(searchInput);modal.appendChild(listWrap);modal.appendChild(closeBtn);
  document.body.appendChild(modal);
  setTimeout(function(){searchInput.focus();},300);
}

  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:#0F1117EE;z-index:9999;display:flex;flex-direction:column;padding:16px;gap:10px';

  var ta=document.createElement('textarea');

  ta.placeholder='અહીં paste કરો...';
  var importBtn=document.createElement('button');
  importBtn.className='btn gn';importBtn.textContent='✅ Import & Merge';
  importBtn.addEventListener('click',function(){
    try{
      var raw=ta.value.trim();
      var parsed=JSON.parse(raw);
      var incoming=parsed.bookings||parsed;
      if(!Array.isArray(incoming)){toast('Invalid data!',false);return;}
      // Merge: newer updatedAt wins
      var local=LS.g('bookings')||[];
      var map={};
      local.forEach(function(b){map[b.quotNo]=b;});
      incoming.forEach(function(b){
        if(!map[b.quotNo]||(new Date(b.updatedAt)>new Date(map[b.quotNo].updatedAt))){
          map[b.quotNo]=b;
        }
      });
      var merged=normalizeBookings(Object.values(map).sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);}));
      APP.bookings=merged;
      LS.s('bookings',merged);
      // If online, also sync to server
      if(APP.online){
        apiFetch('/api/bookings/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookings:merged})})
          .then(function(r){return r.json();})
          .then(function(res){if(res.ok&&res.bookings){APP.bookings=normalizeBookings(res.bookings);LS.s('bookings',APP.bookings);}});
      }
      modal.remove();
      toast('✅ '+merged.length+' bookings import થઈ ગઈ!');
      go('dash');
    }catch(e){toast('Error: Invalid format',false);}
  });
  var closeBtn=document.createElement('button');
  closeBtn.className='btn bm';closeBtn.textContent='બંધ કરો';
  closeBtn.addEventListener('click',function(){modal.remove();});
  modal.appendChild(title);modal.appendChild(hint);modal.appendChild(ta);modal.appendChild(importBtn);modal.appendChild(closeBtn);
  document.body.appendChild(modal);
}

// ── INIT: check server, load data ───────────────────────────
function init(){
  // Step 1: Request persistent storage (prevents browser from clearing data)
  requestPersist();
  // Step 2: Restore from IndexedDB into localStorage if localStorage was cleared
  restoreFromIDB().then(function(){
    // Step 3: Reload hotels from restored storage
    APP.hotels=LS.g('hotels')||DEF_HOTELS;
    // Step 4: Check server & load data
    return checkServer();
  }).then(function(){
    return Promise.all([loadBookings(), loadHotels()]);
  }).then(function(){
    if(APP.online && APP.pendingSync) doSync();
    else go('dash');
    // Pull the latest Package/Itinerary Templates from other devices on
    // startup too — mirrors the Bookings pendingSync check just above,
    // via the new independent template sync path.
    if(APP.online) doTemplateSync(true);
    // Same idea, for the Hotel Master directory — pushes any hotel edits
    // made while this device was offline, and pulls in anything changed on
    // other devices, via the new independent Hotel Master sync path.
    if(APP.online) doHotelSync(true);
    // Show restore notice if we recovered from IDB
    idbGet('bookings').then(function(idbData){
      var lsData=LS.g('bookings')||[];
      if(idbData&&idbData.length>0&&lsData.length===0){
        toast('🔄 Data recovered from backup!');
      }
    });
    // Step 5: If desktop wasn't found via saved IP, try a one-time
    // background network scan for zero-config pairing — doesn't block the UI.
    if(!APP.online){
      scanNetwork(false).then(function(found){
        if(found){ doSync(true); doTemplateSync(true); doHotelSync(true); }
      });
    }
  }).catch(function(){
    // Likely a 401 (expired/invalid token) — apiFetch already triggered
    // the login screen, so there's nothing else to do here.
  });
}

// ── PERIODIC BACKGROUND SYNC (every 20s while app is open AND visible) ───
function backgroundSyncTick(){
  if(document.hidden) return; // skip work while phone is locked / tab backgrounded
  var wasOnline=APP.online;
  checkServer().then(function(isOnline){
    if(isOnline){
      if(!wasOnline)toast('🔗 Connected to desktop!');
      doSync(true); // silent — keeps mobile & desktop continuously in sync
      doTemplateSync(true); // silent — same, for Package/Itinerary Templates
      doHotelSync(true); // silent — same, for the Hotel Master directory (also retries any previously failed upload)
    } else if(!wasOnline){
      // still offline — occasionally retry a full network scan in the background
      scanNetwork(false);
    }
  });
}
setInterval(backgroundSyncTick,20000);
// Catch up immediately when the app regains focus, instead of waiting for the
// next scheduled tick (up to 20s later) — feels instant, no extra polling added.
document.addEventListener('visibilitychange',function(){
  if(!document.hidden) backgroundSyncTick();
});

// ── INSTANT RE-SYNC WHEN APP COMES BACK TO FOREGROUND ────────
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){
    checkServer().then(function(isOnline){ if(isOnline) doSync(true); });
  }
});

// Attaches long-press (500ms) detection to a Booking Card. Mobile only
// (bails out above 768px width). Cancels on scroll/drag (>10px movement) so
// normal list scrolling is never interrupted, and skips entirely if the
// press started on a button (so the existing per-card action buttons in
// bList keep working exactly as before). On a genuine long-press it opens
// the Quick Action Menu and suppresses the synthetic click that would
// otherwise follow touchend (via preventDefault), so the card's own
// existing tap-to-edit behavior — reused, not touched — doesn't also fire.
function attachLongPress(cardEl,bk){
  var timer=null,startX=0,startY=0,fired=false,skip=false;
  var MOVE_TOL=10,PRESS_MS=500;
  function clearTimer(){ if(timer){clearTimeout(timer);timer=null;} }
  cardEl.addEventListener('touchstart',function(e){
    if(window.innerWidth>768){ skip=true; return; }
    skip = !!(e.target && e.target.closest && e.target.closest('button'));
    if(skip) return;
    var t=e.touches[0];startX=t.clientX;startY=t.clientY;fired=false;
    clearTimer();
    timer=setTimeout(function(){
      fired=true;
      if(navigator.vibrate) navigator.vibrate(15);
      openQuickActionMenu(bk);
    },PRESS_MS);
  },{passive:true});
  cardEl.addEventListener('touchmove',function(e){
    if(skip||!timer) return;
    var t=e.touches[0];
    if(Math.abs(t.clientX-startX)>MOVE_TOL || Math.abs(t.clientY-startY)>MOVE_TOL) clearTimer();
  },{passive:true});
  cardEl.addEventListener('touchend',function(e){
    clearTimer();
    if(fired) e.preventDefault(); // suppress the resulting synthetic click
    fired=false;
  },{passive:false});
  cardEl.addEventListener('touchcancel',function(){ clearTimer();fired=false; },{passive:true});
}

  var nav=document.getElementById('nav'),fb=document.getElementById('formBar'),fab=document.getElementById('fabBar'),scb=document.getElementById('stickyCostBar');
  // One-hand UX: while editing a booking, swap the bottom tab bar for a sticky
  // Cancel/Save action bar so the primary action is always one thumb-tap away —
  // no scrolling to the bottom of a long form required.
  if(page==='form'){
    nav.style.display='none'; fb.style.display='flex'; c.classList.add('form-open');

    fab.classList.remove('show'); c.classList.remove('fab-open');
    scb.classList.remove('show');
  }
  updateOptSwitchBarVisibility();
  // Perf fix (1): right after a save, APP.bookings is already up to date locally —
  // re-fetching from the server here just adds a slow network round-trip before the
  // list re-appears. skipFetch=true renders instantly from local memory instead, and
  // a background sync (already triggered by saveBooking) reconciles with the server.
  if(page==='dash'){ if(skipFetch){c.innerHTML='';c.appendChild(bDash());} else{ showLoading(c); loadBookings().then(function(){c.innerHTML='';c.appendChild(bDash());}); } }
  else if(page==='list'){ if(skipFetch){c.innerHTML='';c.appendChild(bList());} else{ showLoading(c); loadBookings().then(function(){c.innerHTML='';c.appendChild(bList());}); } }
  else if(page==='form') c.appendChild(bForm());

  else if(page==='itinTpl'){ loadItinTemplates(); c.appendChild(bItinTemplates()); }
  else if(page==='pkgTpl'){ loadPkgTemplates(); c.appendChild(bPkgTemplates()); }
  else if(page==='sync') c.appendChild(bSyncPage());
  else if(page==='analytics'){ if(skipFetch){c.innerHTML='';c.appendChild(bAnalytics());} else{ showLoading(c); loadBookings().then(function(){c.innerHTML='';c.appendChild(bAnalytics());}); } }
  // Supplier Dues Report — additive page, read-only. Aggregates
  // b.supplierPayments across ALL bookings via computeGlobalSupplierDues();
  // never writes to any booking, never touches calcOpt() or existing
  // Analytics/Dashboard logic.
  else if(page==='supplierDues'){ if(skipFetch){c.innerHTML='';c.appendChild(bSupplierDues());} else{ showLoading(c); loadBookings().then(function(){c.innerHTML='';c.appendChild(bSupplierDues());}); } }
  // Recycle Bin — local-only, instant (no server fetch needed).

// ── Mobile Swipe Navigation between Booking Tabs ────────────────────────
// Left/right swipe moves Guest ⇄ Package ⇄ Hotels ⇄ Vehicle ⇄ Itinerary ⇄
// Docs ⇄ Confirm — the SAME order and the SAME sw(id) tab-switch closure
// bForm() already uses for its tab bar clicks and its existing Prev/Next
// buttons (APP._formTabs / APP._formSwitchTabFn, set inside bForm()). No new
// tab system, no new switching logic — this only decides *which direction*
// to move and calls the existing function, exactly like the Prev/Next
// buttons already do (tabs[idx-1]/tabs[idx+1]).
(function(){
  var content=document.getElementById('content');
  if(!content) return;
  var startX=0,startY=0,startTime=0,ignore=false;
  var DIST=60,RATIO=1.4,MAXTIME=700;
  // Walks up from the touch's target looking for an element that can itself
  // scroll horizontally (e.g. the .tabs bar, or a costing table's scroll
  // wrapper) — if found, that element's own native scrolling handles the
  // gesture instead of the swipe-between-tabs behavior.
  function withinHorizontalScroller(el2){
    while(el2 && el2!==document.body && el2!==document.documentElement){
      var cs=window.getComputedStyle(el2);
      if((cs.overflowX==='auto'||cs.overflowX==='scroll') && el2.scrollWidth>el2.clientWidth+1) return true;
      el2=el2.parentElement;
    }
    return false;
  }
  function isFormField(el2){
    return !!(el2 && el2.closest && el2.closest('input,textarea,select'));
  }
  content.addEventListener('touchstart',function(e){
    if(window.innerWidth>768 || APP.page!=='form') { ignore=true; return; }
    var t=e.touches[0];
    startX=t.clientX; startY=t.clientY; startTime=Date.now();
    ignore = isFormField(e.target) || withinHorizontalScroller(e.target);
  },{passive:true});
  content.addEventListener('touchend',function(e){
    if(ignore || window.innerWidth>768 || APP.page!=='form') return;
    var t=e.changedTouches[0];
    var dx=t.clientX-startX, dy=t.clientY-startY, dt=Date.now()-startTime;
    // Normal vertical scrolling is left completely alone — we never call
    // preventDefault anywhere in this handler — and only a clearly
    // horizontal, reasonably fast, reasonably long drag counts as a swipe.
    if(dt<=MAXTIME && Math.abs(dx)>=DIST && Math.abs(dx)>Math.abs(dy)*RATIO){
      swipeFormTab(dx<0?1:-1);
    }
  },{passive:true});
})();
// Reuses APP._formTabs (the exact tabs[] array from bForm()) and
// APP._formSwitchTabFn (the exact sw(id) closure from bForm()) to move one
// step left/right — identical logic to the existing Prev/Next buttons.
function swipeFormTab(dir){
  if(typeof APP._formSwitchTabFn!=='function' || !APP._formTabs) return;
  var idx=APP._formTabs.findIndex(function(t){return t.id===APP.ftab;});
  if(idx<0) return;
  var newIdx=idx+dir;
  if(newIdx<0 || newIdx>=APP._formTabs.length) return; // already at the first/last tab
  APP._formSwitchTabFn(APP._formTabs[newIdx].id);
}

// Computes the dynamic <title> used by every generated document (Quotation,
// Voucher, Invoice, Receipt). This — NOT the "filename" argument passed into
// openPrint() below — is what Android's native "Save as PDF" print pipeline
// actually uses as the suggested output filename, because openPrint() prints
// the iframe's own document rather than the parent app page. None of the
// document generators previously set a <title> of their own, so every saved
// PDF silently fell back to this parent page's <title>, "✈ Mishri Holidays
// CRM" — regardless of which document or guest it was. Format:
// "GuestName_DocType" (e.g. "Hardik Pandya_Quotation"); if the guest name is
// blank, falls back to the document type alone (e.g. "Quotation") so the
// filename is never empty. A light character strip guards against guest
// names that happen to contain characters filenames can't have.
function pdfFileName(guestName,docType){
  var g=(guestName||'').trim().replace(/[\\/:*?"<>|]/g,'');
  return (g?g+'_':'')+docType;
}

// One-tap "Generate Quotation" shortcuts (mobile Quick Action sheet, mobile
// Floating Action Bar, and the Bookings List row button) previously always
// called makeQuot(bk, bk.selectedOption||1) — i.e. always Option 1 (or

// has 2 or 3 priced options filled in. Fixed here in ONE shared place so all
// three call sites reuse identical logic (no duplicated detection code):
