    +'<div><div style="font-size:10.5px;color:#8A8090">Total Net Cost</div><div style="font-size:18px;font-weight:800;color:#D4A843">'+fmt(grandNet)+'</div></div>'
    +'<div><div style="font-size:10.5px;color:#8A8090">Total Paid</div><div style="font-size:18px;font-weight:800;color:#1E8449">'+fmt(grandPaid)+'</div></div>'
    +'<div style="text-align:right"><div style="font-size:10.5px;color:#8A8090">'+(grandBal<0?'Overpaid By':'Balance Due')+'</div><div style="font-size:18px;font-weight:800;color:'+balColor+'">'+fmt(Math.abs(grandBal))+'</div></div>'
    +'</div>';
  wrap.appendChild(summaryCard);

  if(!groups.length){
    wrap.appendChild(div('font-size:12px;color:#8A8090;font-style:italic;padding:8px 2px','No supplier payment data recorded yet in any booking.'));
    return wrap;
  }

  groups.forEach(function(g){
    var card=el('div');card.className='card';card.style.marginBottom='12px';
    var bc=g.balance>0?'#C0392B':(g.balance<0?'#9B59B6':'#1E8449');
    var head=el('div');
    head.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">'
      +'<div style="font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+g.supplierName+'</div>'
      +'<span class="badge" style="background:#8A80901f;color:#8A8090;flex-shrink:0">'+g.supplierType+'</span>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:6px;flex-wrap:wrap;gap:6px">'
      +'<span style="font-size:11px;color:#8A8090">Net: <b style="color:#D4A843">'+fmt(g.netPayable)+'</b></span>'
      +'<span style="font-size:11px;color:#8A8090">Paid: <b style="color:#1E8449">'+fmt(g.paid)+'</b></span>'
      +'<span style="font-size:11px;color:#8A8090">'+(g.balance<0?'Overpaid':'Balance')+': <b style="color:'+bc+'">'+fmt(Math.abs(g.balance))+'</b></span>'
      +'</div>';
    card.appendChild(head);

    var listWrap=el('div');listWrap.style.cssText='margin-top:8px;padding-top:8px;border-top:1px dashed #eee';
    g.bookings.forEach(function(bk){
      var bbc=bk.balance>0?'#C0392B':(bk.balance<0?'#9B59B6':'#1E8449');
      var row=el('div');row.style.cssText='display:flex;justify-content:space-between;font-size:11px;color:#8A8090;padding:3px 0;gap:8px';
      row.innerHTML='<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(bk.guestName||'\u2014')+' ('+(bk.quotNo||'\u2014')+')</span><span style="color:'+bbc+';font-weight:700;flex-shrink:0">'+fmt(Math.abs(bk.balance))+(bk.balance<0?' over':'')+'</span>';
      listWrap.appendChild(row);
    });
    card.appendChild(listWrap);
    wrap.appendChild(card);
  });

  return wrap;
}
</script>
<script>
// ══════════════════════════════════════════════════════════════
//  DOCUMENT GENERATION — Quotation, Multi-Quotation, Voucher,
//  Invoice, and Payment Receipt generators, plus their directly
//  inseparable shared helpers (logo/contact/CSS partials, quote
//  sales-copy blocks, amount-in-words).
//
//  Extracted verbatim from index.html (Phase 4 modularization;
//  re-verified and re-extracted against the updated production
//  baseline CRM_WORKING_BACKUP_20260725-085258.zip).
//  No logic, HTML, CSS, formatting, calculations, filenames,
//  receipt-per-installment behavior, or print/PDF behavior changed
//  beyond the approved live fix below.
//
//  LIVE FIX (this baseline): makeInv() and makeReceipt()'s legacy
//  single-payment path now compute 'received' via
//  getPaymentSummary(b).totalReceived instead of
//  parseFloat(b.paymentReceived)||0 — so Invoice and the legacy
//  Receipt correctly reflect the summed Payment History installments
//  rather than a possibly-stale single field. getPaymentSummary()
//  itself is unchanged and still lives in the main script (excluded
//  in Phase 5 as buildTab-coupled) — called here cross-file, same
//  proven pattern as calcOpt()/fmt()/nts().
//
//  NOT extracted (deliberately left in the main script, because they
//  are called directly by buildTab/UI code, not just internally by
//  these document functions — same rule applied to fmt()/nts() in
//  Phase 3):
//    - pdfFileName()        — also called directly by buildTab for
//                             every Generate Voucher/Invoice/Receipt/
//                             Quotation button, not just by these
//                             functions internally.
//    - optionHasData(), getFilledOptions(), fastQuot() — a UI dispatch
//                             wrapper that CALLS INTO makeQuot()/
//                             makeMultiQuot(), not a dependency of them.
//    - defaultInvoiceItems() — also called directly by buildTab's
//                             Invoice-items editor UI.
//    - getPaymentSummary()   — only referenced in comments here; its
//                             one real call site (besides makeInv()/
//                             makeReceipt() above, cross-file) is
//                             buildTab's payment-history UI.
//    - fmtT(), vehicleTypeLabel() — part of the shared fmtD()/
//                             mealLabel() formatter cluster elsewhere
//                             in the main script, not document-only.
//
//  All of the above continue to work exactly as before, called as
//  globals across files — the same pattern as calcOpt()/nts()/fmt()
//  in Phases 2 and 3.
// ══════════════════════════════════════════════════════════════
function openPrint(html,filename,shareInfo){
  filename=filename||'Mishri_Document';
  var baseName=filename.replace('.pdf','').replace('.html','');

  // Create preview overlay
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:#000d;z-index:9999;display:flex;flex-direction:column';

  // Top bar
  var topBar=document.createElement('div');
  topBar.style.cssText='background:#1A1D27;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid #2A2D3A';

  // Close function
  function closeOverlay(){ document.body.removeChild(overlay); }

  // Back button (big, left side)
  var backBtn=document.createElement('button');
  backBtn.className='btn bm sm';
  backBtn.innerHTML='&#8592; Back';
  backBtn.style.cssText='border-radius:16px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:#8A8090;border:1.5px solid #8A8090;flex-shrink:0';
  backBtn.addEventListener('click',closeOverlay);

  var titleEl=document.createElement('div');
  titleEl.style.cssText='color:#D4A843;font-weight:700;font-size:12px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px';
  titleEl.textContent=baseName;

  var btnRow=document.createElement('div');
  btnRow.style.cssText='display:flex;gap:6px;flex-shrink:0';

  // Save PDF button — uses Android's native print pipeline (same mechanism
  // as the old Print button) instead of html2canvas/html2pdf.js. Switched
  // after repeated, confirmed-via-real-device-testing failures in the
  // html2canvas approach: dark/black backgrounds, fully blank PDFs, and
  // partial/incomplete content — all different failure modes of the same
  // underlying issue, that a hand-rolled JS DOM-to-canvas renderer has to
  // reimplement layout and paint itself rather than using the browser's own
  // battle-tested rendering engine. Native print doesn't have this class of
  // bug: it's the same pipeline used for printing every webpage on every
  // Android device, and it respects the color-scheme:only light already
  // declared in this document's own <head> correctly by design — no cloning,
  // no onclone workarounds, no timing races needed.
  // Trade-off (explicitly chosen for reliability): this opens Android's
  // native print dialog — the user picks "Save as PDF" and taps save/download
  // there — instead of a fully silent one-tap download. A few more taps,
  // but this bypasses the entire class of bugs above.
  var dlBtn=document.createElement('button');
  dlBtn.style.cssText='border-radius:16px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#D4A843;color:#1a1d27;border:1.5px solid #D4A843';
  dlBtn.textContent='🖨 Save PDF';
  dlBtn.addEventListener('click',function(){
    // REAL fix for the dynamic filename (confirmed against an actual saved
    // PDF, which still came out as "_Mishri_Holidays_CRM.pdf" even after the
    // generated document got its own <title>): Android's native print/"Save
    // as PDF" dialog is driven by THIS top-level app page — the one that
    // called print() — not by the iframe whose content is being printed. Its
    // own <title> ("✈ Mishri Holidays CRM", set once in this file's <head>)
    // is what the OS was actually using as the suggested filename, regardless
    // of any <title> inside the iframe's document. So instead: swap this
    // page's own document.title to the desired name right before printing,
    // then restore it once printing is done (via 'afterprint', with a timed
    // fallback in case that event doesn't fire reliably on a given device).
    var prevTitle=document.title;
    document.title=baseName;
    var restored=false;
    function restoreTitle(){
      if(restored)return;
      restored=true;
      document.title=prevTitle;
      iframe.contentWindow.removeEventListener('afterprint',restoreTitle);
    }
    iframe.contentWindow.addEventListener('afterprint',restoreTitle);
    setTimeout(restoreTitle,60000); // safety net if 'afterprint' never fires
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  });

  btnRow.appendChild(dlBtn);

  // ── WhatsApp Share button (Level 1: reuses the SAME native Save-PDF
  // pipeline above — no PDF blob/canvas involved, so none of the
  // dark-background/blank-PDF/incomplete-content bugs that native print
  // was specifically adopted to avoid can resurface here). Only appears
  // when the caller passes shareInfo — every existing openPrint() call
  // site that doesn't pass it keeps working exactly as before, unchanged.
  // Flow: tap once -> triggers the same "Save PDF" print dialog -> once
  // the user closes it (having saved or not), a WhatsApp chat opens with
  // a pre-filled message asking them to attach the file they just saved.
  // This is a manual attach (1-2 extra taps), by design — it deliberately
  // does NOT try to auto-attach a file, since that would require a real
  // PDF Blob/Web Share API path that this app moved away from for
  // reliability reasons (see the "Save PDF" button comment above).
  if(shareInfo && shareInfo.contact){
    var waBtn=document.createElement('button');
    waBtn.style.cssText='border-radius:16px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#25D366;color:#fff;border:1.5px solid #25D366';
    waBtn.textContent='📤 WhatsApp';
    waBtn.addEventListener('click',function(){
      var msg='Hi '+(shareInfo.guestName||'')+', please find your '+(shareInfo.docType||'document')+' below. \n\n(We just opened the Save dialog for you — please tap the attach button here in WhatsApp and select the PDF you saved from your Downloads/Files, then hit send.)\n\n— Mishri Holidays';
      var phone=(shareInfo.contact||'').replace(/[^0-9]/g,'');
      var url=phone?('https://wa.me/'+phone+'?text='+encodeURIComponent(msg)):('https://wa.me/?text='+encodeURIComponent(msg));
      // Defensive: some sandboxed preview environments (not the real deployed
      // site) restrict iframe.contentWindow.print(). If that throws for any
      // reason, WhatsApp should still open — this never should block sharing.
      try{ dlBtn.click(); }catch(e){ console.error('Save PDF trigger failed:',e); }
      setTimeout(function(){ window.open(url,'_blank'); },400);
    });
    btnRow.appendChild(waBtn);
  }
  topBar.appendChild(backBtn);
  topBar.appendChild(titleEl);
  topBar.appendChild(btnRow);
  overlay.appendChild(topBar);

  // ── Preview engine (shared by Quotation / Voucher / Invoice / Receipt) ──
  // Rendered at a fixed "print-like" width (PREVIEW_W, matching the
  // ~210mm/A4 layout the document CSS was designed for) so every document
  // renders exactly like the final PDF: proportionally-sized table columns
  // with enough room for their text, no wrapping/overflow collisions (this
  // is what originally fixed the Voucher table overflow, and it's untouched
  // here). What changed vs. the previous version: that fixed-width page is
  // NO LONGER force-scaled-to-fit on load. Auto-fitting it to the screen
  // via a computed CSS transform is exactly what was blocking native
  // pinch-to-zoom/browser-zoom and making long documents hard to read.
  // Instead:
  //   - The page starts at true 100% size (zoom=1 → no transform at all).
  //   - previewViewport scrolls both ways (overflow:auto, native momentum
  //     scrolling), so at 100% on a narrow phone screen the user pans/
  //     scrolls or pinch-zooms exactly like any normal web page.
  //   - The ➕/➖/Reset buttons below apply an explicit, user-chosen
  //     transform:scale() (50%–200%, 10% steps) purely on this parent-page
  //     wrapper — never touching the iframe's own document/CSS.
  // None of this affects iframe.contentWindow.print() below, which still
  // prints the iframe's own document based on its own content/print rules,
  // completely unaffected by this parent-page-only preview chrome — so the
  // already-correct PDF/print output is untouched.
  var PREVIEW_W=800;
  var ZOOM_MIN=0.5, ZOOM_MAX=2.0, ZOOM_STEP=0.1;
  var zoom=1;

  // Zoom toolbar — sits above the preview window, per spec (desktop zoom
  // controls). Buttons are large enough to also work fine as touch targets
  // on mobile, but their main audience is desktop/mouse users since mobile
  // already gets native pinch-to-zoom back.
  var zoomBar=document.createElement('div');
  zoomBar.style.cssText='background:#20232E;padding:6px 10px;display:flex;justify-content:center;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid #2A2D3A';
  function zoomBtn(label,title){
    var b=document.createElement('button');
    b.textContent=label;
    b.title=title;
    b.style.cssText='border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;background:#2A2D3A;color:#D4A843;border:1.5px solid #3A3D4A;min-width:36px';
    return b;
  }
  var zoomOutBtn=zoomBtn('➖','Zoom Out');
  var zoomLabel=document.createElement('div');
  zoomLabel.style.cssText='color:#D4A843;font-weight:700;font-size:12px;min-width:44px;text-align:center';
  var zoomInBtn=zoomBtn('➕','Zoom In');
  var zoomResetBtn=zoomBtn('🔄','Reset (100%)');
  zoomBar.appendChild(zoomOutBtn);
  zoomBar.appendChild(zoomLabel);
  zoomBar.appendChild(zoomInBtn);
  zoomBar.appendChild(zoomResetBtn);
  overlay.appendChild(zoomBar);

  var previewViewport=document.createElement('div');
  previewViewport.style.cssText='flex:1;overflow:auto;background:#6e7175;-webkit-overflow-scrolling:touch';
  var scaleOuter=document.createElement('div');
  scaleOuter.style.cssText='margin:14px auto;box-shadow:0 2px 14px rgba(0,0,0,.35)';
  var scaleInner=document.createElement('div');
  scaleInner.style.cssText='width:'+PREVIEW_W+'px;transform-origin:top left;background:#fff';
  var iframe=document.createElement('iframe');
  iframe.style.cssText='display:block;border:none;width:'+PREVIEW_W+'px;background:#fff;color-scheme:only light';
  scaleInner.appendChild(iframe);
  scaleOuter.appendChild(scaleInner);
  previewViewport.appendChild(scaleOuter);
  overlay.appendChild(previewViewport);

  // Native mobile pinch-to-zoom / desktop browser zoom on this preview is
  // blocked at the page level by the app's own <meta viewport> (it sets
  // maximum-scale=1.0/user-scalable=no so normal CRM screens don't zoom
  // when a field is tapped). Temporarily relax just that meta tag while
  // this preview overlay is open, and restore the app's original setting
  // the moment it closes — so this fix is scoped to the preview only and
  // every other screen in the CRM keeps behaving exactly as before.
  var viewportMeta=document.querySelector('meta[name="viewport"]');
  var prevViewportContent=viewportMeta?viewportMeta.getAttribute('content'):null;
  if(viewportMeta) viewportMeta.setAttribute('content','width=device-width,initial-scale=1.0');

  var origCloseOverlay=closeOverlay;
  closeOverlay=function(){
    if(viewportMeta&&prevViewportContent!==null) viewportMeta.setAttribute('content',prevViewportContent);
    origCloseOverlay();
  };
  backBtn.removeEventListener('click',origCloseOverlay);
  backBtn.addEventListener('click',closeOverlay);

  document.body.appendChild(overlay);

  // Write HTML into iframe
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();

  // Applies the current zoom level as a CSS transform on this parent-page
  // wrapper only (never touching the iframe's own document/CSS), and keeps
  // scaleOuter sized to the post-zoom footprint so the scrollable area is
  // always exactly right — no clipped edges, no leftover blank space —
  // whether zoomed in (needs both horizontal + vertical scroll) or out.
  function applyZoom(){
    var doc=iframe.contentDocument;
    var contentH=1131;
    if(doc&&doc.documentElement){
      contentH=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0)||1131;
    }
    iframe.style.height=contentH+'px';
    scaleInner.style.transform='scale('+zoom+')';
    scaleOuter.style.width=(PREVIEW_W*zoom)+'px';
    scaleOuter.style.height=(contentH*zoom)+'px';
    zoomLabel.textContent=Math.round(zoom*100)+'%';
  }
  function setZoom(z){
    zoom=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,+z.toFixed(2)));
    applyZoom();
  }
  zoomInBtn.addEventListener('click',function(){ setZoom(zoom+ZOOM_STEP); });
  zoomOutBtn.addEventListener('click',function(){ setZoom(zoom-ZOOM_STEP); });
  zoomResetBtn.addEventListener('click',function(){ setZoom(1); });

  iframe.addEventListener('load',function(){ setTimeout(applyZoom,60); });
  setTimeout(applyZoom,60); // document.write() doesn't always re-fire 'load'
  window.addEventListener('resize',applyZoom);
}

// Returns an <img> tag for the official company logo.
//   heightPx : rendered height in px. Width is left as "auto" so the
//              browser always scales using the image's own aspect ratio —
//              it can never be stretched or squashed.
//   badge    : pass true when placing the logo on a dark-coloured header
//              bar (e.g. the Voucher's navy header) — wraps it in a small
//              light rounded card so the logo stays clearly visible against
//              the dark background. Leave false/omitted for headers that
//              already sit directly on the document's white page background
//              (Quotation, Multi-Quotation, Invoice, Receipt).
// If the image ever fails to load for any reason, onerror simply hides the
// broken-image icon (display:none) instead of throwing a JS error — so a
// document always finishes generating correctly, logo or no logo.
function docLogoHtml(heightPx,badge){
  heightPx=heightPx||42;
  var img='<img src="'+MISHRI_LOGO_DATA_URI+'" alt="Mishri Holidays" '
    +'style="display:block;height:'+heightPx+'px;width:auto;max-width:220px;object-fit:contain" '
    +'onerror="this.style.display=\'none\'">';
  if(badge){
    return '<span style="display:inline-block;background:#F7F7F7;border-radius:6px;padding:4px 10px;line-height:0">'+img+'</span>';
  }
  return img;
}

// ════════════════════════════════════════════════════════════
//  COMPANY CONTACT DETAILS — single reusable helper shared by every
//  document generator (Quotation, Multi-Quotation, Voucher, Invoice,
//  Receipt) so the official mobile numbers / email live in ONE place
//  instead of being duplicated across documents. To update the contact
//  details for every document at once, edit ONLY the constants below.
// ════════════════════════════════════════════════════════════
var MISHRI_MOBILE_1='+91 99981 47184';
var MISHRI_MOBILE_2='+91 79909 17434';
var MISHRI_EMAIL='mishriholidays@gmail.com';
// V2.2: official postal address, added as its own shared constant/array
// (one line per printed line) so it lives in exactly ONE place — same
// pattern as the mobile/email constants above. No document hardcodes
// this text itself; every document reads it via docAddressHtml() below
// (called directly by docContactHtml(), and by makeVouch()'s header,
// which has its own layout and doesn't call docContactHtml()).
var MISHRI_ADDRESS_LINES=['E/103, Rosewood Residency','Near Bansal Mall, Gotri','Vadodara \u2013 390021','Gujarat, India'];

// Returns the shared postal-address markup, one line per array entry
// above, joined with <br> so it renders as proper multi-line address
// text (requirement: "keep proper line spacing") using whatever
// font-family/size/colour the caller's wrapping container already sets
// — same convention docContactHtml() below already follows.
function docAddressHtml(){
  return MISHRI_ADDRESS_LINES.join('<br>');
}

// Returns the shared contact markup: both mobile numbers on a single line
// with a phone icon, followed by the email on its own line with an email
// icon, followed by the postal address on its own lines. Each number is
// wrapped in white-space:nowrap so it can never break awkwardly across two
// lines (e.g. "99981" / "47184" splitting apart).
// Callers wrap this in their own existing container (div/class) so each
// document keeps its own font-size/colour/positioning exactly as before —
// this helper only supplies the inner contact content.
function docContactHtml(){
  return '<span style="white-space:nowrap">&#9742;&nbsp;'+MISHRI_MOBILE_1+'</span>'
    +'&nbsp;/&nbsp;'
    +'<span style="white-space:nowrap">'+MISHRI_MOBILE_2+'</span>'
    +'<br>'
    +'<span style="white-space:nowrap">&#9993;&nbsp;'+MISHRI_EMAIL+'</span>'
    // V2.2: address, directly below the existing contact details, in the
    // same wrapping container so it automatically inherits the exact same
    // font-family/size/colour already used for the lines above — no new
    // styling introduced here.
    +'<br>'
    +'<span style="display:inline-block;margin-top:2px">'+docAddressHtml()+'</span>';
}

// ════════════════════════════════════════════════════════════
//  SHARED PRINT & TYPOGRAPHY POLISH CSS — reused by every document
//  generator (Quotation, Multi-Quotation, Voucher, Invoice, Receipt) so
//  presentation-only fixes (no-wrap utility for short labels like vehicle
//  type / cab numbers, and PDF page-break behaviour for tables) live in ONE
//  place instead of being duplicated 5 times. Purely additive: does not
//  touch any existing colour, font, size, spacing or structural rule in the
//  per-document stylesheets.
// ════════════════════════════════════════════════════════════
function docPolishCss(){
  return '.nowrap{white-space:nowrap}'
    +'table{page-break-inside:auto}'
    +'tr{page-break-inside:avoid}'
    +'thead{display:table-header-group}';
}

// Shared across Quotation generators: derive a readable Pickup/Drop summary from
// the Vehicle tab entries (v.from / v.to), instead of wrongly showing the
// destination name in that field.
function pickupDropStr(b){
  var vehs=(b.vehicles||[]).filter(function(v){return v.from||v.to;});
  if(!vehs.length) return 'As per itinerary';
  return vehs.map(function(v){return (v.from||'—')+' &rarr; '+(v.to||'—');}).join(' &nbsp;|&nbsp; ');
}
// Shared Vehicle Details table (Type, Cab No., Pick Up, Drop) for the Quotation docs —
// same info the Voucher already shows, so guests see it before confirming too.
// BUG FIX (V2.1): previously this always appended a hardcoded line ("650 kms
// included in package; any usage beyond to be paid directly to driver") after
// the table, regardless of what the user had or hadn't entered.
// FEATURE (V2.1, added on request right after the bug fix above): a real
// "Vehicle Remarks" field now exists (b.vehicleRemarks — Vehicle tab, below
// the vehicle cards). remarksText is that value, passed in by the caller.
// If it's blank/null/undefined, nothing is printed (same as the bug-fix
// behavior). If it has text, ONLY that exact user-entered text is printed —
// no default is ever injected, however this is called.
function vehTableHtml(vehs, remarksText){
  if(!vehs||!vehs.length) return '';
  var rows=vehs.map(function(v){
    return '<tr><td class="nowrap">'+(v.type||'—')+'</td><td class="nowrap">'+(v.vehicleNo||'—')+'</td><td>'+(v.from||'—')+'</td><td>'+(v.to||'—')+'</td></tr>';
  }).join('');
  var remarksHtml='';
  if(remarksText && String(remarksText).trim()){
    remarksHtml='<div style="font-size:9.5px;color:#666;margin-bottom:6px">'+String(remarksText).trim()+'</div>';
  }
  return '<div class="section-title">VEHICLE DETAILS</div>'
    +'<table style="margin-bottom:8px"><tr><th>Vehicle Type</th><th>Cab No.</th><th>Pick Up</th><th>Drop</th></tr>'+rows+'</table>'
    +remarksHtml;
}

// Premium sales-copy sections (content only) — shared by makeQuot (single option)
// and makeMultiQuot (multi-option) so both stay consistent. No pricing, itinerary
// or inclusions/exclusions logic here — pure copy blocks using the doc's existing
// CSS classes (.section-title etc.) so styling stays 100% consistent with the rest
// of the template.
function quotWelcomeMsg(b){
  return '<p style="text-align:center;font-size:9.5px;color:#555;font-style:italic;line-height:1.6;max-width:640px;margin:0 auto 12px;padding:0 6px">Dear <b style="color:#1a1d27;font-style:normal">'+b.guestName+'</b>, thank you for considering Mishri Holidays for your upcoming journey. This quotation has been thoughtfully prepared to match your travel preferences with the perfect balance of comfort, quality and value. We look forward to creating a memorable, comfortable and worry-free holiday experience for you and your family.</p>';
}
function quotWhyChooseUs(){
  var usps=['Personalised Holiday Planning','Transparent Pricing','Dedicated Travel Consultant','Carefully Selected Hotels','Verified Travel Partners','Quick Response Assistance','On-Trip Travel Support','Tailor-Made Holiday Experiences'];
  var chips=usps.map(function(u){return '<div style="font-size:9.5px;color:#1a1d27;padding:5px 9px;background:#fdf6e3;border-left:2.5px solid #D4A843;border-radius:3px">&#10003; '+u+'</div>';}).join('');

}

// V2.8 — Revision label for quotation PDFs. Reuses the EXISTING revision
// system as-is: b.selectedRevision is already set by the existing "+ New
// Revision" button / activateRevision() (see the Revisions data layer
// above) — this function does not create any new counter, does not write
// to b.revisions, and does not call addNewRevision()/activateRevision()/
// ensureRevisions(). It only READS b.selectedRevision and returns a small
// HTML badge — empty string for the original (0/undefined), "REV. N" for
// any later revision. Shared by makeQuot(), makeMultiQuot(), and
// makeDmcQuot() so all three always show the exact same number, since
// they all read the same shared field.
function revBadgeHtml(b){
  var n=(b&&b.selectedRevision)?parseInt(b.selectedRevision,10):0;
  if(!n||n<=0||isNaN(n)) return '';
  return '<div style="display:inline-block;margin-top:6px;padding:3px 12px;border:1.5px solid #D4A843;border-radius:20px;font-family:\'Poppins\',Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;color:#B8892F;background:#FBF3E0">REV. '+n+'</div>';
}

function makeQuot(b,on){
  var c=calcOpt(b,on),opt=b['opt'+on]||[];
  var hotels=opt.filter(function(h){return h.hotelName&&h.checkIn&&h.checkOut;});
  var vehs=(b.vehicles||[]).filter(function(v){return v.type||v.cost>0;});
  var inc=(b.inclusions||[]).filter(Boolean);
  var exc=(b.exclusions||[]).filter(Boolean);

  // Hotel rows - Destination | Hotel & Room | Meal | Rooms format (like PDF)
  var destMap={};
  hotels.forEach(function(h){
    var n=nts(h.checkIn,h.checkOut);
    var key=h.place+'___'+n;
    if(!destMap[key]) destMap[key]={place:h.place,nights:n,hotels:[],checkIn:h.checkIn,checkOut:h.checkOut};
    destMap[key].hotels.push(h);
  });

  var hotelRows='';
  hotels.forEach(function(h){
    var n=nts(h.checkIn,h.checkOut);
    var extraBits=[];
    if(parseInt(h.extraAdults)>0)extraBits.push('Extra Adult: '+h.extraAdults);
    if(parseInt(h.extraMattress)>0)extraBits.push('Extra Mattress: '+h.extraMattress);
    if(parseInt(h.chargeableChild)>0)extraBits.push('Child (WB): '+h.chargeableChild);
    if(parseInt(h.childNoBed)>0)extraBits.push('Child (NB): '+h.childNoBed);
    var extraNote=extraBits.length?'<br><span style="font-size:8.5px;color:#8B4513">'+extraBits.join(' &bull; ')+'</span>':'';
    // Bug fix (2): show Room Category clearly plus Check-in / Check-out dates
    hotelRows+='<tr>'
      +'<td style="font-weight:600;color:#1a1d27">'+h.place+' — '+n+'N</td>'
      +'<td>'+h.hotelName+'<br><span style="font-size:9px;color:#666">'+(h.roomCat||'—')+'</span>'+extraNote+'</td>'
      +'<td style="text-align:center" class="nowrap">'+fmtD(h.checkIn)+'</td>'
      +'<td style="text-align:center" class="nowrap">'+fmtD(h.checkOut)+'</td>'
      +'<td style="text-align:center">'+mealLabel(h.mealPlan)+'</td>'
      +'<td style="text-align:center">'+h.rooms+'</td>'
      +'</tr>';
  });

  // Vehicle section
  var vehSection='';
  if(vehs.length>0){
    var vehRows=vehs.map(function(v){
      return '<li style="padding:3px 0;font-size:10px">'+v.type+(v.from?' — '+v.from:'')+(v.to?' to '+v.to:'')+'</li>';
    }).join('');
    vehSection='<div style="margin-top:6px;font-size:10px"><b style="color:#1a1d27">Vehicle:</b> '+vehs.map(function(v){return v.type;}).join(', ')+'</div>'
      +'<ul style="padding-left:15px;margin-top:4px">'+vehRows+'</ul>';
  }

  // Cost card data comes directly from calcOpt() below — no separate table rows needed.

  // Itinerary rows
  var itrRows='';
  if(b.itinerary&&b.itinerary.some(function(d){return d;})){
    b.itinerary.forEach(function(d,i){
      if(!d) return;
      itrRows+='<p style="margin-bottom:8px"><b style="color:#D4A843">Day '+(i+1)+' — </b>'+d+'</p>';
    });
  }

  // Inclusions & Exclusions
  var incHTML=inc.map(function(x){return '<li style="padding:2px 0;font-size:9.5px;color:#1a6b3c">'+x+'</li>';}).join('');
  var excHTML=exc.map(function(x){return '<li style="padding:2px 0;font-size:9.5px;color:#c0392b">'+x+'</li>';}).join('');

  // Bug fix (3): Removed the auto-generated "Houseboat Cruise Itinerary" block that
  // used to appear by default whenever a hotel name contained "houseboat" — it
  // inserted hardcoded timings the user never entered. Real itinerary details should
  // be added by the user on the Itinerary tab instead.
  var houseboatNote='';

  var dateStr=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  var travelDate=b.startDate?fmtD(b.startDate):'As per discussion';
  var duration=hotels.length>0?(function(){
    var totalNights=0;hotels.forEach(function(h){totalNights+=nts(h.checkIn,h.checkOut);});
    return (totalNights+1)+' Days / '+totalNights+' Nights';
  })():'—';
  var pickupDrop=pickupDropStr(b);
  var childNote=(c.chargeableChild>0||c.childNoBedQty>0?'Package costed for '+c.adults+' Adults'+(c.chargeableChild>0?' + '+c.chargeableChild+' Child (With Bed)':'')+(c.childNoBedQty>0?' + '+c.childNoBedQty+' Child (No Bed)':'')+'. Children below 5 yrs travel complimentary without extra mattress.':'Package costed for '+c.adults+' Adults.')+(c.maxExtraMattress>0?' Incl. '+c.maxExtraMattress+' Extra Mattress.':'')+(c.gstPct>0?' GST @ '+c.gstPct+'% included in total.':' GST not applicable / not included.');

  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+pdfFileName(b.guestName,'Quotation')+'</title>'
    // Bug fix (Android black background, investigated — root cause confirmed
    // inside makeQuot's own generated document, not openPrint/html2canvas):
    // Android Chrome/WebView's "Force Dark" auto-theming repaints a page's
    // background as black when the page doesn't explicitly opt out of it.
    // This document only ever declared body{background:#fff} — the <html>
    // element itself had no background, so on phones with system/in-app dark
    // mode enabled, the area behind/around the body (visible while scrolling,
    // or whenever the content is shorter than the screen) could render solid
    // black instead of white. The color-scheme meta+CSS below tells the
    // browser this page is light-only so it stops trying to dark-theme it,
    // and html{background:#fff} makes sure the root element is never left
    // transparent/black as a fallback. This only affects the on-screen
    // Preview — PDF export already forces backgroundColor:'#ffffff' via
    // html2canvas in openPrint(), so exported PDFs were never affected.
    +'<meta name="color-scheme" content="only light">'
    +'<style>'+DOC_FONT_CSS+'</style>'
    +'<style>'
    +':root{color-scheme:only light}'
    +'*{margin:0;padding:0;box-sizing:border-box}'
    +'html{background:#fff}'
    +'body{font-family:"Poppins",Arial,Helvetica,sans-serif;font-size:10.5px;color:#2b2b2b;background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}'
    +'.page{max-width:210mm;margin:0 auto;padding:10mm 14mm}'
    +'.logo-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}'
    +'.logo-name{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:26px;font-weight:900;color:#B8892F;letter-spacing:0.3px}'
    +'.logo-sub{font-family:"Poppins",sans-serif;font-size:8.5px;color:#999;margin-top:2px;letter-spacing:1.5px;text-transform:uppercase}'
    +'.tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:11px;color:#999}'
    +'.divider-gold{border:none;border-top:2.5px solid #D4A843;margin:6px 0 10px}'
    +'.title-block{text-align:center;margin-bottom:12px}'
    +'.main-title{font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:900;color:#1a1d27;letter-spacing:1.5px}'
    +'.sub-title{font-family:"Poppins",sans-serif;font-size:11.5px;color:#B8892F;font-weight:600;margin-top:4px;letter-spacing:0.4px}'
    +'.info-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:14px}'
    +'.info-row{display:contents}'
    +'.info-label{background:#fff;color:#B8892F;font-weight:600;font-size:9px;padding:7px 10px;border-bottom:1px solid #eee;letter-spacing:0.5px;text-transform:uppercase}'
    +'.info-value{background:#fff;font-size:10.5px;padding:7px 10px;border-bottom:1px solid #eee;color:#1a1d27;font-weight:500}'
    +'.section-title{background:#D4A843;color:#1a1d27;font-weight:700;font-size:10px;padding:6px 12px;margin:14px 0 8px;letter-spacing:1px;text-transform:uppercase;border-radius:2px}'
    +'table{width:100%;border-collapse:collapse}'
    +'th{background:#1a1d27;color:#D4A843;padding:7px 8px;text-align:left;font-size:9px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase}'
    +'td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle;font-size:10.5px;font-weight:400}'
    +'tr:nth-child(even) td{background:#fafafa}'
    +'.cost-table{border:1.5px solid #D4A843;border-radius:6px;overflow:hidden;margin:10px 0}'
    +'.cost-table th{background:#1a1d27;font-size:10px}'
    +'.cost-table td{font-size:11px;padding:8px}'
    +'.summary-box{background:linear-gradient(135deg,#fff8e0,#fef3c7);border:2px solid #D4A843;border-radius:8px;padding:14px;margin:12px 0;text-align:center}'
    +'.cost-note{font-size:9px;color:#777;font-style:italic;margin-top:8px}'
    +'.ie-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}'
    +'.section-head{font-family:"Poppins",sans-serif;font-weight:700;font-size:10px;margin-bottom:6px;padding-bottom:3px;border-bottom:1.5px solid currentColor;letter-spacing:0.5px;text-transform:uppercase}'
    +'ul.inc-list{padding-left:14px} ul.inc-list li{color:#1a6b3c;font-size:9.5px;padding:2px 0}'
    +'ul.exc-list{padding-left:14px} ul.exc-list li{color:#c0392b;font-size:9.5px;padding:2px 0}'
    +'.terms{background:#f9f9f9;border:1px solid #eee;border-radius:4px;padding:10px 12px;margin-top:10px}'
    +'.terms-title{font-family:"Poppins",sans-serif;font-weight:700;font-size:10px;color:#1a1d27;margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}'
    +'.terms ul{padding-left:14px} .terms li{font-size:9px;color:#666;padding:2px 0}'
    +'.footer{border-top:2.5px solid #D4A843;margin-top:16px;padding-top:10px;display:flex;justify-content:space-between;align-items:center}'
    +'.footer-brand{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:13px;font-weight:700;color:#1a1d27}'

    +'@media print{.page{padding:6mm 10mm}}'
    +'.hotel-acc-tbl{border:1.5px solid #aaa}'
    +'.hotel-acc-tbl th,.hotel-acc-tbl td{border:1.5px solid #aaa;padding-top:8px;padding-bottom:8px}'
    +'.hotel-acc-tbl th{border-color:rgba(255,255,255,0.28)}'
    +docPolishCss()+'</style></head><body><div class="page">'

    // Logo bar — left side now shows the official logo image via the shared
    // docLogoHtml() helper (see PDF GENERATORS section); right-side tagline
    // text is unchanged, layout/spacing of .logo-bar untouched.
    +'<div class="logo-bar">'
    +'<div>'+docLogoHtml(46)+'</div>'
    +'<div class="tagline">Your Trusted Travel Partner</div>'
    +'</div>'
    +'<hr class="divider-gold">'

    // Title
    +'<div class="title-block">'
    +'<div class="main-title">'+( b.destination ? b.destination.toUpperCase() : 'HOLIDAY' )+' QUOTATION</div>'
    +revBadgeHtml(b)
    +(hotels.length>0?'<div class="sub-title">'+hotels.map(function(h){return h.place+(nts(h.checkIn,h.checkOut)>0?' ('+nts(h.checkIn,h.checkOut)+'N)':'');}).join(' &bull; ')+'</div>':'')
    +'</div>'

    // Premium Welcome Message
    +quotWelcomeMsg(b)

    // Guest info grid
    +'<div class="info-grid">'
    +'<div class="info-label">Guest Name</div><div class="info-value"><b>'+b.guestName+'</b></div>'
    +'<div class="info-label">Tour Start Date</div><div class="info-value">'+(b.startDate?fmtD(b.startDate):travelDate)+'</div>'
    +'<div class="info-label">Tour End Date</div><div class="info-value">'+(b.endDate?fmtD(b.endDate):'—')+'</div>'

    +'<div class="info-label">Adults / Children</div><div class="info-value">'+c.adults+' Adults'+(c.chargeableChild>0?' / '+c.chargeableChild+' Child (WB)':'')+(c.childNoBedQty>0?' / '+c.childNoBedQty+' Child (NB)':'')+'</div>'
    +'<div class="info-label">Duration</div><div class="info-value">'+duration+'</div>'
    +'<div class="info-label">Quotation No.</div><div class="info-value">'+b.quotNo+'</div>'
    +'<div class="info-label">Issue Date</div><div class="info-value">'+dateStr+'</div>'
    +'</div>'

    // Vehicle details
    +vehTableHtml(vehs, b.vehicleRemarks)

    // Hotel & Accommodation
    +(hotelRows?
      '<div class="section-title">HOTEL &amp; ACCOMMODATION DETAILS</div>'
      +'<table class="hotel-acc-tbl"><tr><th>Destination</th><th>Hotel &amp; Room Category</th><th style="text-align:center">Check-In</th><th style="text-align:center">Check-Out</th><th style="text-align:center">Meal Plan</th><th style="text-align:center">Rooms</th></tr>'
      +hotelRows
      +'</table>'
      :'')
    +quotHotelAvailabilityNote()

    // Houseboat note if applicable
    +houseboatNote

    // Package cost — decorative price card (big number) instead of a plain table
    +'<div class="section-title">TOUR COST</div>'
    +'<div style="border:2px solid #D4A843;border-radius:10px;overflow:hidden;max-width:320px;margin:0 auto 4px;page-break-inside:avoid;break-inside:avoid">'
    +'<div style="background:#1a1d27;color:#D4A843;padding:6px 12px;font-weight:800;font-size:10px;letter-spacing:0.5px;text-align:center">'+vehicleTypeLabel(vehs)+'</div>'
    +'<div style="padding:14px 12px;text-align:center;background:linear-gradient(135deg,#fff8e0,#fef3c7)">'
    +'<div style="font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.6px">Per Person Cost ('+c.adults+' Adults)</div>'
    +'<div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;color:#B8892F;margin-top:3px">'+fmt(c.perAdult)+'<span style="font-size:12px;font-weight:600"> / person</span></div>'
    +(c.chargeableChild>0?'<div style="font-size:10px;color:#8B4513;margin-top:4px">+ '+fmt(c.perChild)+'/- per Child (With Bed) &times; '+c.chargeableChild+'</div>':'')
    +(c.childNoBedQty>0?'<div style="font-size:10px;color:#8B4513;margin-top:2px">+ '+fmt(c.perChildNoBed)+'/- per Child (No Bed) &times; '+c.childNoBedQty+'</div>':'')

function makeMultiQuot(b, options){

      if(hi>0 && n){/* nights not separately shown here — already implied by dates */}

    // Decorative price card per option — big number, small caption, like a

    var hotelNamesForCard=hotels.map(function(h){return h.hotelName;}).join(', ')||'—';
    priceCards+='<div style="flex:1;min-width:0;border:2px solid '+cols[on]+';border-radius:10px;overflow:hidden;background:'+bgcols[on]+';page-break-inside:avoid;break-inside:avoid">'

      +(c.chargeableChild>0?'<div style="font-size:9.5px;color:#8B4513;margin-top:4px">+ '+fmt(c.perChild)+'/- per Child (WB) &times; '+c.chargeableChild+'</div>':'')

    // Same Android/Chrome forced-dark-mode fix already applied in makeQuot() —

// ════════════════════════════════════════════════════════════
//  V2.4 TRIAL — DMC QUOTATION (COPY/PASTE) — NEW, ISOLATED FUNCTION
//  Approved scope: wraps a manually pasted/edited DMC quotation with
//  Mishri Holidays branding only. Does NOT parse, interpret, extract,
//  or map anything from the pasted text — it is reproduced exactly as
//  entered (line breaks and spacing preserved via white-space:pre-wrap).
//  Reuses the EXISTING shared branding helpers only (docLogoHtml,
//  docContactHtml, docPolishCss) — does not call calcOpt(), does not
//  touch makeQuot()/makeMultiQuot(), does not read Hotel Rate Master,
//  Payment, Revision, or Sync data in any way.
// ════════════════════════════════════════════════════════════
function makeDmcQuot(b,rawText,htmlContent){
  var dateStr=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+pdfFileName(b.guestName,'Quotation')+'</title>'
    +'<meta name="color-scheme" content="only light">'
    +'<style>'+DOC_FONT_CSS+'</style>'
    +'<style>'
    +':root{color-scheme:only light}'
    +'*{margin:0;padding:0;box-sizing:border-box}'
    +'html{background:#fff}'
    +'body{font-family:"Poppins",Arial,Helvetica,sans-serif;font-size:10.5px;color:#2b2b2b;background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}'
    +'.page{max-width:210mm;margin:0 auto;padding:10mm 14mm}'
    +'.logo-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}'
    +'.tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:11px;color:#999}'
    +'.divider-gold{border:none;border-top:2.5px solid #D4A843;margin:6px 0 14px}'
    +'.title-block{text-align:center;margin-bottom:14px}'
    +'.main-title{font-family:"Playfair Display",Georgia,serif;font-size:22px;font-weight:900;color:#1a1d27;letter-spacing:1px}'
    +'.sub-title{font-family:"Poppins",sans-serif;font-size:10.5px;color:#B8892F;font-weight:600;margin-top:4px}'
    // Pasted content: plain, readable block. pre-wrap preserves the user's
    // exact line breaks/spacing (requirement 9) while still wrapping long
    // lines so nothing runs off the printed page.
    +'.dmc-content{white-space:pre-wrap;word-wrap:break-word;font-family:"Poppins",Arial,Helvetica,sans-serif;font-size:11px;color:#1a1d27;line-height:1.7;border:1px solid #eee;border-radius:6px;padding:14px 16px;background:#fff}'
    // V2.6 — table-friendly styling, used only when htmlContent (a pasted,
    // sanitized DMC table) is present. When it IS present, .dmc-content's
    // own white-space:pre-wrap is turned off below (inline, on that one
    // div) so real table layout — not literal whitespace — controls
    // spacing, exactly like a normal HTML table would render anywhere else.
    +'.dmc-content table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:9.5px}'
    +'.dmc-content th,.dmc-content td{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top;word-break:break-word}'
    +'.dmc-content th{background:#f5f5f5;font-weight:700;color:#1a1d27}'
    +'.dmc-content tr:nth-child(even) td{background:#fafafa}'
    +'.dmc-content p{margin:4px 0}'
    +'.footer{border-top:2.5px solid #D4A843;margin-top:18px;padding-top:10px;display:flex;justify-content:space-between;align-items:center}'
    +'.footer-contact{font-size:9.5px;color:#666}'
    +'@media print{.page{padding:6mm 10mm} .dmc-content table{page-break-inside:auto} .dmc-content tr{page-break-inside:avoid}}'
    +docPolishCss()+'</style></head><body><div class="page">'

    // Header — Mishri Holidays branding only (requirement 12/13). Reuses the
    // exact same shared helper every other document already uses.
    +'<div class="logo-bar">'
    +'<div>'+docLogoHtml(46)+'</div>'
    +'<div class="tagline">Your Trusted Travel Partner</div>'
    +'</div>'
    +'<hr class="divider-gold">'

    +'<div class="title-block">'
    +'<div class="main-title">'+( b.destination ? b.destination.toUpperCase() : 'HOLIDAY' )+' QUOTATION</div>'
    +revBadgeHtml(b)
    +'<div class="sub-title">Guest: '+(b.guestName||'—')+' &bull; Quotation No. '+(b.quotNo||'—')+' &bull; '+dateStr+'</div>'
    +'</div>'

    // V2.6 — DMC content: if a sanitized HTML table was captured on paste
    // (htmlContent, already allowlist-sanitized by sanitizeDmcHtml() before
    // ever reaching here — see that function), render it as real HTML so
    // rows/columns/bold/line-breaks display as a table. Otherwise, fall
    // back to the ORIGINAL, unchanged plain-text path — same escaping,
    // same pre-wrap rendering, same as before this feature existed.
    +(htmlContent
      ? '<div class="dmc-content" style="white-space:normal">'+htmlContent+'</div>'
      : '<div class="dmc-content">'+escHtmlPreserveLines(rawText)+'</div>')

    // Footer — Mishri Holidays contact/address only (requirement 12/13).
    +'<div class="footer"><div><div style="font-family:\'Playfair Display\',Georgia,serif;font-style:italic;font-size:13px;font-weight:700;color:#1a1d27">&#9992; Mishri Holidays</div><div class="footer-contact">'+docContactHtml()+'</div></div>'
    +'<div style="font-size:9px;color:#888;font-style:italic">Your Trusted Travel Partner</div></div>'
    +'</div></body></html>';
}

// Small isolated helper used only by makeDmcQuot() above — HTML-escapes the
// pasted text (so any stray "<", ">", "&" from the DMC's message can't break
// the generated document) while keeping every line break exactly where the
// user put it. Does not touch, call, or interact with any existing escape
// helper elsewhere in the file.
function escHtmlPreserveLines(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════
//  V2.6 — DMC TABLE PASTE: HTML sanitizer. Allowlist-only, no external
//  library. Used exclusively by the DMC tab's paste handler, before
//  anything reaches b.dmcQuoteHtml or the quotation PDF.
//
//  Security note on the parsing step: this deliberately uses DOMParser
//  (which produces a fully inert document — no scripts execute, no
//  images/external resources load, no event-handler attributes fire)
//  INSTEAD OF `container.innerHTML = rawHtml`. Setting innerHTML with
//  untrusted markup — even on an element never attached to the live
//  document — can still trigger e.g. an <img onerror="..."> payload the
//  instant the browser parses it, before any sanitization code runs.
//  DOMParser avoids that entire class of bug by construction.
// ════════════════════════════════════════════════════════════
var DMC_ALLOWED_TAGS={
  TABLE:1,THEAD:1,TBODY:1,TFOOT:1,TR:1,TH:1,TD:1,
  P:1,BR:1,STRONG:1,B:1,EM:1,I:1,U:1,SPAN:1,DIV:1,UL:1,OL:1,LI:1
};
var DMC_ALLOWED_ATTRS={ TD:['colspan','rowspan'], TH:['colspan','rowspan'] };
var DMC_SAFE_STYLE_PROPS=['font-weight','text-align'];

function sanitizeDmcStyle(styleStr){
  if(!styleStr) return '';
  var out=[];
  styleStr.split(';').forEach(function(rule){
    var parts=rule.split(':');
    if(parts.length!==2) return;
    var prop=parts[0].trim().toLowerCase();
    var val=parts[1].trim();
    if(DMC_SAFE_STYLE_PROPS.indexOf(prop)===-1) return;
    // Extra safety net even though these props shouldn't normally carry
    // url()/expression() — block outright if they somehow do.
    if(/url\s*\(|expression\s*\(|javascript:/i.test(val)) return;
    out.push(prop+':'+val);
  });
  return out.join(';');
}

// Recursively rebuilds a sanitized copy of `node` into `out` (an element
// in the MAIN document). Every new element is created fresh via
// document.createElement() and only ever receives text nodes or further
// sanitized children — innerHTML is never set on anything here with
// unsanitized content, and tags that can load external content (img,
// a/href, iframe, object, etc.) are simply never in the allowlist at all.
function sanitizeDmcNode(node,out){
  if(node.nodeType===3){ out.appendChild(document.createTextNode(node.nodeValue)); return; }
  if(node.nodeType!==1) return; // drop comments and anything else
  var tag=node.tagName;
  if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED'||tag==='LINK'||tag==='META'||tag==='IMG'||tag==='A'||tag==='FORM'||tag==='INPUT'||tag==='BUTTON'||tag==='SVG'){
    return; // drop entirely, including children — never unwrapped
  }
  if(DMC_ALLOWED_TAGS[tag]){
    var clean=document.createElement(tag);
    (DMC_ALLOWED_ATTRS[tag]||[]).forEach(function(a){
      if(node.hasAttribute(a)){
        var v=node.getAttribute(a);
        if(/^[0-9]{1,3}$/.test(v)) clean.setAttribute(a,v); // digits only, hard cap
      }
    });
    var styleVal=sanitizeDmcStyle(node.getAttribute('style'));
    if(styleVal) clean.setAttribute('style',styleVal);
    for(var i=0;i<node.childNodes.length;i++){ sanitizeDmcNode(node.childNodes[i],clean); }
    out.appendChild(clean);
  } else {
    // Unknown/disallowed tag (e.g. Outlook/Word wrapper tags): unwrap —
    // keep its safe children, discard the tag itself, so real content
    // isn't lost just because of an unfamiliar wrapper element.
    for(var j=0;j<node.childNodes.length;j++){ sanitizeDmcNode(node.childNodes[j],out); }
  }
}

function sanitizeDmcHtml(rawHtml){
  if(!rawHtml) return '';
  var doc;
  try{ doc=new DOMParser().parseFromString(String(rawHtml),'text/html'); }
  catch(e){ return ''; }
  if(!doc||!doc.body) return '';
  var out=document.createElement('div');
  for(var i=0;i<doc.body.childNodes.length;i++){ sanitizeDmcNode(doc.body.childNodes[i],out); }
  return out.innerHTML;
}

// Feature (7): amount-in-words helper for the Payment Receipt (Indian numbering)
function numToWords(num){
  num=Math.round(num||0);
  if(num===0) return 'Zero';
  var neg=num<0; num=Math.abs(num);
  var ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  var tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n){ if(n<20) return ones[n]; return (tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'')).trim(); }
  function threeDigit(n){ var s=''; if(n>=100){ s+=ones[Math.floor(n/100)]+' Hundred'; n=n%100; if(n) s+=' '; } if(n>0) s+=twoDigit(n); return s; }
  var crore=Math.floor(num/10000000); num%=10000000;
  var lakh=Math.floor(num/100000); num%=100000;
  var thousand=Math.floor(num/1000); num%=1000;
  var rest=num;
  var parts=[];
  if(crore) parts.push(threeDigit(crore)+' Crore');
  if(lakh) parts.push(threeDigit(lakh)+' Lakh');
  if(thousand) parts.push(threeDigit(thousand)+' Thousand');
  if(rest) parts.push(threeDigit(rest));
  return (neg?'Minus ':'')+parts.join(' ');
}

//  DATE/MEAL/VEHICLE FORMATTERS — moved here from the main script.
//
//  Extracted verbatim from index.html against the production
//  baseline CRM_WORKING_BACKUP_20260725-085258.zip, following a
//  dedicated audit confirming fmtT()/mealLabel()/vehicleTypeLabel()
//  (and the MEAL_PLAN_LABELS constant) have ZERO real call sites
//  anywhere outside this file's own makeVouch()/makeQuot() — unlike
//  fmtD()/nts(), which remain in the main script because they are
//  genuinely shared across the main script, analytics.js, and
//  documents.js (10 and 21 real call sites respectively across 3
//  execution contexts). No logic, signatures, or call sites changed.
// ══════════════════════════════════════════════════════════════
// Bug fix (5): format a "HH:MM" time value as a friendly 12-hour AM/PM string for the voucher
function fmtT(t){
  if(!t) return '';
  var m=String(t).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return t;
  var h=parseInt(m[1],10),min=m[2];
  var ap=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0)h12=12;
  return h12+':'+min+' '+ap;
}
// Bug fix (5): Show the full meaning of the meal-plan code in brackets, e.g. "MAP (Breakfast and Dinner)"
var MEAL_PLAN_LABELS={CP:'Breakfast Only',MAP:'Breakfast and Dinner',AP:'Breakfast, Lunch and Dinner',EP:'No Meals',AI:'All Inclusive'};
function mealLabel(code){
  if(!code) return '\u2014';
  var key=String(code).toUpperCase();
  var l=MEAL_PLAN_LABELS[key];
  return l?(key+' ('+l+')'):code;
}
// Bug fix (3): Use the vehicle type(s) actually entered on the Vehicle tab instead of a hardcoded name.
function vehicleTypeLabel(vehs){
  var names=(vehs||[]).map(function(v){return (v.type||'').trim();}).filter(Boolean);
  return names.length?names.map(function(n){return '<span style="white-space:nowrap">'+n+'</span>';}).join(', '):'As per itinerary';
}

// ══════════════════════════════════════════════════════════════
//  nts() and fmtD() — moved here from the main script.
//
//  Extracted verbatim against the production baseline
//  CRM_WORKING_BACKUP_20260725-085258.zip. No logic, signatures, or
//  edge-case behavior changed.
//
//  Target-module rationale: both are called from 3 execution
//  contexts (main script, one other already-extracted module, and
//  documents.js), but documents.js is the majority consumer for
//  both — nts() has 8 of its 12 real call sites here (vs. 1 in
//  calculations.js's calcOpt() and 3 in the main script's
//  buildTab()); fmtD() has 21 of its 23 real call sites here (vs.
//  1 each in the main script's bList() and analytics.js's bDash()).
//  Same rationale as the fmtT()/mealLabel()/vehicleTypeLabel() move
//  in the prior phase.
//
//  nts()'s one call inside calcOpt() (js/calculations.js) is on the
//  money path — its return value multiplies directly into room
//  cost. All other real call sites (buildTab, and every use here
//  in documents.js) are display-only. fmtD() is display-only
//  everywhere it's called.
//
//  Both remain called as globals from the main script, analytics.js,
//  and calculations.js exactly as before — the same cross-file
//  pattern proven safe since Phase 2.
// ══════════════════════════════════════════════════════════════
// ── CALC ────────────────────────────────────────────────────
function nts(a,b){if(!a||!b)return 0;var d=(new Date(b)-new Date(a))/86400000;return d>0?Math.round(d):0;}
function fmtD(d){if(!d)return '\u2014';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
</script>

// ══════════════════════════════════════════════════════════════
//  SUPPLIER AUTO-FILL — reads the SELECTED option's Hotels rows,

//  b.dmcBillingAmount — never calls calcOpt(), never writes back to the

function computeHotelSupplierTotals(b){
  var idx=(b&&b.selectedOption)||1;
  var hotels=(getOptFields(b,idx)&&getOptFields(b,idx).hotels)||[];

      +n*(parseInt(h.extraAdults)||0)*(parseFloat(h.extraAdultRate)||0)
      +n*(parseInt(h.chargeableChild)||0)*(parseFloat(h.childRate)||0)
      +n*(parseInt(h.childNoBed)||0)*(parseFloat(h.childNoBedRate)||0);
    var key=h.hotelName.trim();

    if(totals[key]===undefined){totals[key]=0;order.push(key);}

function computeVehicleSupplierTotals(b){

function computeDmcSupplierEntry(b){
  var amt=parseFloat(b&&b.dmcBillingAmount)||0;

function applySupplierAutoFill(b){
  if(!Array.isArray(b.supplierPayments)) b.supplierPayments=[];
  var candidates=getSupplierAutoFillCandidates(b);
  var added=0,updated=0;
  candidates.forEach(function(c){

      return s&&(s.supplierName||'').trim().toLowerCase()===c.supplierName.trim().toLowerCase()&&s.supplierType===c.supplierType;
    })[0];

    else{ b.supplierPayments.push({id:supplierUid(),supplierName:c.supplierName,supplierType:c.supplierType,netPayable:c.netPayable,payments:[]}); added++; }
  });

}
// Overwrite-protection preview — computes what applySupplierAutoFill() WOULD

// existing (possibly manually-edited) Net Payable gets silently overwritten.
// Read-only; payments[] (paid history) is never part of this diff since
// Auto-Fill never touches it.
function getSupplierAutoFillDiff(b){
  var supplierList=Array.isArray(b.supplierPayments)?b.supplierPayments:[];
  var candidates=getSupplierAutoFillCandidates(b);
  var changes=[],newCount=0,unchangedCount=0;
  candidates.forEach(function(c){
    var existing=supplierList.filter(function(s){
      return s&&(s.supplierName||'').trim().toLowerCase()===c.supplierName.trim().toLowerCase()&&s.supplierType===c.supplierType;
    })[0];
    if(!existing){ newCount++; return; }
    var oldVal=Math.round((parseFloat(existing.netPayable)||0)*100)/100;
    if(oldVal!==c.netPayable){ changes.push({supplierName:c.supplierName,supplierType:c.supplierType,oldValue:oldVal,newValue:c.netPayable}); }
    else unchangedCount++;
  });
  return {changes:changes,newCount:newCount,unchangedCount:unchangedCount,total:candidates.length};
}

function el(tag){return document.createElement(tag);}

// Hybrid Date Input: supports BOTH a tappable date-picker AND free manual typing
// in DD/MM/YY or DD/MM/YYYY (also accepts '-' or '.' separators, and a typed
// YYYY-MM-DD is accepted too). Internal storage stays exactly what it always
// was — an ISO 'YYYY-MM-DD' string — so nts(), fmtD(), the auto check-out→next
// check-in carry-over logic, and every quotation/voucher/invoice/receipt that
// reads these fields keep working completely unchanged.
function isoToDMY(iso){
  if(!iso)return '';
  var p=String(iso).split('-');
  if(p.length!==3)return '';

  if(!/^\d{4}$/.test(y)||!/^\d{1,2}$/.test(mo)||!/^\d{1,2}$/.test(d))return '';
  return d+'/'+mo+'/'+y;
}
function parseFlexDate(str){
  str=String(str||'').trim();
  if(!str)return null;
  var iso=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  var d,mo,y;
  if(iso){y=parseInt(iso[1],10);mo=parseInt(iso[2],10);d=parseInt(iso[3],10);}
  else{
    var m=str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);
    if(!m)return null;
    d=parseInt(m[1],10);mo=parseInt(m[2],10);y=parseInt(m[3],10);
    if(m[3].length===2)y=(y<=68?2000:1900)+y;

  var daysInMonth=new Date(y,mo,0).getDate();

function paymentDateInp(val,setter,ph){
  var wrap=el('div');wrap.className='inp';
  wrap.style.cssText='position:relative;display:flex;align-items:center;padding:0';
  var t=el('input');t.type='text';t.value=isoToDMY(val);t.placeholder=ph||'DD/MM/YYYY';
  t.setAttribute('inputmode','numeric');t.setAttribute('autocomplete','off');
  t.style.cssText='flex:1;min-width:0;background:transparent;border:none;outline:none;color:inherit;font-size:15px;font-family:inherit;padding:12px 34px 12px 13px;box-sizing:border-box';
  var hd=el('input');hd.type='date';hd.value=val||'';hd.setAttribute('aria-label','Pick date');
  hd.style.cssText='position:absolute;right:2px;top:0;width:34px;height:100%;opacity:0;cursor:pointer;border:none;padding:0;margin:0';
  var icon=el('span');icon.textContent='📅';icon.setAttribute('aria-hidden','true');
  icon.style.cssText='position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:.75';

  });

// Bug fix: some restricted in-app browsers/WebViews can leave a fetch() or

// left action buttons stuck showing a spinner forever with no feedback. Racing
// against a timeout guarantees the UI always recovers and tells the user what
// happened, even if the underlying call never completes.
function withTimeout(promise,ms,label){
  return new Promise(function(resolve,reject){
    var settled=false;
    var timer=setTimeout(function(){
      if(!settled){settled=true;reject(new Error((label||'Operation')+' timed out'));}
    },ms);
    promise.then(function(v){if(!settled){settled=true;clearTimeout(timer);resolve(v);}},
                 function(e){if(!settled){settled=true;clearTimeout(timer);reject(e);}});
  });

// Wraps the first substring match of q inside text with <mark> for visual
// highlighting. Pure display helper — not a filter, doesn't decide matches.
function highlightMatch(text,q){
  text=text==null?'':String(text);
  if(!q) return text;
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+'<mark class="gs-mark">'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}

// ── TIMESTAMP ───────────────────────────────────────────────
function now(){return new Date().toISOString();}
// ── SERVER CHECK ────────────────────────────────────────────
// Tries: 1) saved IP, 2) relative URL (when hosted on desktop itself)
var SAVED_IP=LS.g('serverIp')||null;
var SERVER_CANDIDATES=[];

function buildCandidates(){
  var c=[];
  if(SAVED_IP) c.push('http://'+SAVED_IP+':7842');
  // If served from desktop directly, relative works
  if(window.location.hostname!=='localhost'&&window.location.port==='7842'){
    c.push(window.location.origin);
  }
  // Common home router subnets to scan
  var subnets=['192.168.29','192.168.1','192.168.0','10.0.0'];
  subnets.forEach(function(s){
    if(SAVED_IP&&SAVED_IP.startsWith(s)) return; // already added
    c.push('http://'+s+'.1:7842'); // try .1 as fallback
  });
  return c;
}

function tryUrl(url){
  return fetch(url+'/api/ip',{
    signal:AbortSignal.timeout?AbortSignal.timeout(1500):undefined,
    mode:'cors'
  }).then(function(r){return r.json();})
    .then(function(d){return {ok:true,ip:d.ip,base:url};});
}

function checkServer(){
  // 1) Try same-origin first — this covers BOTH:
  //    a) App deployed on Netlify (mobile & desktop both hit the same cloud URL)
  //    b) App served by the desktop LAN server itself (port 7842)
  return tryUrl(window.location.origin).then(function(res){
    res.relative=true;return res;
  }).catch(function(){
    // 2) Fall back to LAN discovery (saved IP / subnet guesses) —
    //    only relevant when the app was opened as a local file on mobile
    //    and is pairing with a desktop server on the same WiFi.
    var candidates=buildCandidates();
    var chain=Promise.reject(new Error('start'));
    candidates.slice(0,4).forEach(function(url){
      chain=chain.catch(function(){return tryUrl(url);});
    });
    return chain;
  }).then(function(res){
    APP.online=true;
    APP.useRelative=!!res.relative;
    if(APP.useRelative){
      APP.serverIp='cloud';
    } else {
      APP.serverIp=res.ip||res.base.replace('http://','').replace(':7842','');
      SAVED_IP=APP.serverIp;
      LS.s('serverIp',SAVED_IP);
    }
    updateStatusBar();return true;
  }).catch(function(){APP.online=false;updateStatusBar();return false;});
}

// ── LAN AUTO-DISCOVERY (zero-config pairing) ─────────────────
// Tries to find the desktop server on the same WiFi automatically,
// without the user having to type in an IP address.
function getLocalIP(){
  return new Promise(function(resolve){
    try{
      var RTCPeerConnection=window.RTCPeerConnection||window.mozRTCPeerConnection||window.webkitRTCPeerConnection;
      if(!RTCPeerConnection){resolve(null);return;}
      var pc=new RTCPeerConnection({iceServers:[]});
      var done=false;
      pc.createDataChannel('');
      pc.onicecandidate=function(e){
        if(done||!e.candidate)return;
        var m=/([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
        if(m&&m[1]!=='0.0.0.0'){done=true;try{pc.close();}catch(e2){}resolve(m[1]);}
      };
      pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).catch(function(){if(!done){done=true;resolve(null);}});
      setTimeout(function(){if(!done){done=true;try{pc.close();}catch(e3){}resolve(null);}},1200);
    }catch(e){resolve(null);}
  });
}
function scanRange(prefix,start,end,port){
  return new Promise(function(resolve){
    var found=false,i=start,batchSize=40;
    function nextBatch(){
      if(found)return;
      if(i>end){if(!found)resolve(null);return;}
      var batch=[];
      for(var k=0;k<batchSize&&i<=end;k++,i++){
        (function(ip){
          batch.push(tryUrl('http://'+prefix+'.'+ip+':'+port).then(function(res){
            if(!found){found=true;resolve(res);}
          }).catch(function(){}));
        })(i);
      }
      Promise.all(batch).then(function(){if(!found)nextBatch();});
    }
    nextBatch();
  });
}
function scanNetwork(showToast){
  if(showToast)toast('🔍 Desktop shodhi rahya chhiye (WiFi scan)...');
  return getLocalIP().then(function(ip){
    var prefixes=[];
    if(ip){var p=ip.split('.');if(p.length===4)prefixes.push(p[0]+'.'+p[1]+'.'+p[2]);}
    ['192.168.1','192.168.0','192.168.29','192.168.225','192.168.43','10.0.0'].forEach(function(pr){
      if(prefixes.indexOf(pr)<0)prefixes.push(pr);
    });
    var chain=Promise.resolve(null);
    prefixes.forEach(function(prefix){
      chain=chain.then(function(res){if(res)return res;return scanRange(prefix,1,254,7842);});
    });
    return chain;
  }).then(function(res){
    if(res&&res.ip){
      APP.online=true;APP.useRelative=false;APP.serverIp=res.ip;SAVED_IP=res.ip;LS.s('serverIp',res.ip);
      updateStatusBar();
      if(showToast)toast('✅ Desktop connected! '+res.ip);
      return true;
    } else {
      if(showToast)toast('Desktop na malyu — IP manually nakho',false);
      return false;
    }
  });
}
